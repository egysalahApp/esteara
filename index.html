<body class="selection:bg-violet-200 flex flex-col min-h-screen">

    <script type="text/babel">
        const { useState } = React;

        // ================= أداة تحويل الأرقام إلى عربية =================

            const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return String(num).split('').map(c => arabicNumbers[c] || c).join('');
        };

        // ================= الأيقونات (SVG نقية 100%) =================
        const IconCheckCircle = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;

        const IconSparkles = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>;
        const IconYoutube = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21.582,6.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.254,4,12,4,12,4S5.746,4,4.186,4.418 c-0.86,0.23-1.538,0.908-1.768,1.768C2,7.746,2,12,2,12s0,4.254,0.418,5.814c0.23,0.86,0.908,1.538,1.768,1.768 C5.746,20,12,20,12,20s6.254,0,7.814-0.418c0.86-0.23,1.538-0.908,1.768-1.768C22,16.254,22,12,22,12S22,7.746,21.582,6.186z M10,15.464V8.536L16,12L10,15.464z"/></svg>;
        const IconLightbulb = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.9 1.2 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg>;
        const IconTrophy = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>;

        // ================= قاعدة البيانات المحدثة (40 تدريباً) =================
        const QUIZ_QUESTIONS = [
            { text: "«ابتسمت الفرصة للشاب الطموح»\nما نوع الاستعارة هنا؟", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 0, explanation: "لأنه شبه (الفرصة) بإنسان يبتسم، وحذف المشبه به وأبقى صفة من صفاته (الابتسام).", hint: "الفرصة لا تبتسم، من الذي يبتسم وحذفناه؟" },
            { text: "قال المعلق: «سجل الصقر هدف الفوز لفريقنا» (يقصد اللاعب).\nما نوع الاستعارة؟", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 1, explanation: "لأنه شبه (اللاعب) بالصقر، وحذف المشبه وصرّح بلفظ المشبه به (الصقر).", hint: "من الذي يسجل الأهداف؟" },
            { text: "لمن يبذل جُهدًا بلا فائدة: «أنت تنفخ في رماد!»\nهذه الصورة تسمى:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 2, explanation: "لأنه شبه (حالة من يبذل جُهدًا بلا فائدة) بـ(حالة من ينفخ في الرماد ليشعله).", hint: "هذه الصورة تشبه حالة كاملة بحالة كاملة، كالأمثال." },
            { text: "«غردت هواتفنا برسائل النجاح»\nنوع الاستعارة:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 0, explanation: "لأنه شبه (الهواتف) بطيور تغرد، وحذف المشبه به وأبقى صفة التغريد.", hint: "ما الكائن الذي يغرد؟ لقد أخفيناه وأبقينا صفته." },
            { text: "قال المدير: «ودعنا أقمارًا تخرجوا من جامعتنا اليوم»\nنوع الاستعارة:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 1, explanation: "لأنه شبه (الطلاب) بالأقمار، وحذف المشبه وصرّح بالمشبه به.", hint: "من المقصود بالأقمار؟ لقد نطقنا بالمشبه به مباشرة." },
            { text: "لمن يعود لعادة سيئة تركها: «رجعت حليمة لعادتها القديمة»\nهذه الصورة:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 2, explanation: "لأنه شبه موقف (من يعود لفعل تركه) بموقف المرأة (حليمة) في المثل الشهير.", hint: "هذا مثل شعبي، والأمثال دائمًا تمثل مواقف كاملة." },
            { text: "«طارت الأخبار السعيدة في أرجاء المدينة»\nنوع الاستعارة:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 0, explanation: "لأنه شبه الأخبار السعيدة بطيور تطير، وحذف المشبه به (الطيور).", hint: "الأخبار لا تطير. ما الذي يطير وحذفناه من الجملة؟" },
            { text: "تحدثت مع بحرٍ في الطب (تقصد طبيبًا بارعًا).\nنوع الاستعارة:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 1, explanation: "لأنه شبه الطبيب العظيم بالبحر في علمه، فصرّح بالمشبه به (بحر).", hint: "لقد صرحنا بالمشبه به (بحر) وحذفنا المشبه (الطبيب)." },
            { text: "لمن يصنع الخير في غير أهله: «أنت تزرع في البحر»\nهذه الصورة:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 2, explanation: "لأنه شبه حالة صانع الخير في غير أهله بمن يزرع في ماء البحر.", hint: "موقف يقابله موقف آخر بالكامل، لتوضيح سوء التصرف." },
            { text: "«افترس المرض جسد الرجل الضعيف»\nما نوع الاستعارة؟", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 0, explanation: "لأنه شبه المرض بحيوان مفترس، وحذف الحيوان وأبقى صفة الافتراس.", hint: "الافتراس صفة لشيء محذوف." },
            // الأسئلة المستبدلة (11 و 12)
            { text: "قال تعالى: «واعتصموا بحبل الله جميعًا ولا تفرقوا» (يقصد دين الله).\nما نوع الاستعارة؟", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 1, explanation: "لأنه شبه (الدين) بالحبل، وحذف المشبه وصرّح بالمشبه به.", hint: "ماذا يقصد بالحبل هنا؟" },
            { text: "«نطق الجدار مبينًا أمجاد حضارتنا»\nنوع الاستعارة:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 0, explanation: "لأنه شبه (الجدار) بإنسان ينطق، وحذف المشبه به وأبقى صفة النطق.", hint: "الجدار لا ينطق. من الذي ينطق وحذفناه من الجملة؟" },
            // بقية الأسئلة
            { text: "لمن يحاول إخفاء الحقيقة: «أنت تحجب الشمس بغربال!»\nهذه الصورة:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 2, explanation: "لأنه شبه موقف إخفاء الحقيقة بموقف تغطية نور الشمس بغربال.", hint: "صورة تمثيلية لحالة شخص يحاول فعل المستحيل." },
            { text: "«رأيت أسدًا يطلق النار على الأعداء» (يقصد جنديًا)\nنوع الاستعارة:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 1, explanation: "لأنه شبه الجندي بالأسد، وصرح بالمشبه به.", hint: "الأسد لا يطلق النار." },
            { text: "«بكى اليتيم فبكت معه الجدران»\nنوع الاستعارة:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 0, explanation: "لأنه شبه الجدران بإنسان يبكي، وحذف الإنسان.", hint: "أعطى الجدران صفة البكاء." }
        ];

        const CLASSIFY_PHRASES = [
            { text: "بكى السحاب على الأرض العطشى", type: "makneya", explanation: "استعارة مكنية: شبه السحاب بإنسان يبكي، وحذف المشبه به (الإنسان).", hint: "السحاب لا يبكي، هناك إنسان مخفي." },
            { text: "شاهدت أسدًا يقود الطائرة الحربية", type: "tasreheya", explanation: "استعارة تصريحية: صرح بـ (أسد) وحذف المشبه وقصد الطيار الشجاع.", hint: "هل الأسد يقود طائرة؟." },
            { text: "لمن يشتري المجهول: «أنت تشتري سمكًا في ماء»", type: "tamtheleya", explanation: "استعارة تمثيلية: تشبيه حالة (شراء المجهول) بحالة (شراء السمك قبل صيده).", hint: "موقف يشبه موقفًا في الحياة." },
            { text: "عضتنا الأيام بنابها القاسي", type: "makneya", explanation: "استعارة مكنية: شبه الأيام بحيوان مفترس، وحذفه وأبقى صفة العض.", hint: "الأيام ليس لها ناب. من صاحب الناب الذي اختفى هنا؟" },
            { text: "قابلت كوكبًا في علوم الحاسوب", type: "tasreheya", explanation: "استعارة تصريحية: صرح بـ (كوكب) وقصد العالِم البارع.", hint: "نقصد العالِم." },
            { text: "لمن يتردد: «أراك تقدم رجلًا وتؤخر أخرى»", type: "tamtheleya", explanation: "استعارة تمثيلية: تشبيه حالة المتردد بهذه الصورة.", hint: "هذه صورة حركية تمثل التردد وعدم الحسم." },
            { text: "زأر الجندي في وجه الأعداء", type: "makneya", explanation: "استعارة مكنية: شبه الجندي بأسد، وحذف المشبه به وأبقى صفة الزئير.", hint: "الزئير صفة لحيوان معين لم يذكر اسمه في الجملة." },
            { text: "«نسورنا تحمي سماء الوطن في كل وقت» (يقصد الطيارين)", type: "tasreheya", explanation: "استعارة تصريحية: شبه (الطيارين) بالنسور، وحذف المشبه وصرّح بلفظ المشبه به.", hint: "صرحنا بكلمة (النسور) مباشرة." },
            { text: "«عادت المياه إلى مجاريها» (بعد خصام)", type: "tamtheleya", explanation: "استعارة تمثيلية: شبه حالة عودة العلاقات بحالة عودة المياه لمسارها.", hint: "مثل يقال عند الصلح بعد الخصام." },
            { text: "«عضنا الفقر بنابه»", type: "makneya", explanation: "استعارة مكنية: شبه الفقر بوحش له ناب، وحذف المشبه به.", hint: "هل الفقر له أسنان؟ ماذا حذفنا؟" },
            // السؤال المستبدل (11)
            { text: "«ابتسم الصباح ووزع نوره على الكون»", type: "makneya", explanation: "استعارة مكنية: شبه الصباح بإنسان يبتسم، وحذف المشبه به.", hint: "الصباح لا يبتسم، لمن هذه الصفة؟" },
            // بقية الأسئلة
            { text: "«من تدخل فيما لا يعنيه لقي ما لا يرضيه» (لمن يتدخل دائمًا)", type: "tamtheleya", explanation: "استعارة تمثيلية: تشبيه موقف المتطفل بموقف من يلقى الأذى.", hint: "حكمة تقال في مواقف التطفل." },
            { text: "«تبتسم الزهور في الربيع»", type: "makneya", explanation: "استعارة مكنية: شبه الزهور بإنسان يبتسم.", hint: "أعطينا الزهور صفة بشرية." },
            { text: "«أضاءت النجوم سماء التفوق» (الطلاب الأوائل)", type: "tasreheya", explanation: "استعارة تصريحية: شبه الطلاب بالنجوم وصرح بالمشبه به.", hint: "نصرح بكلمة (النجوم) ونقصد الطلاب." },
            { text: "«أنت تبحث عن إبرة في كومة قش» (لمن يبحث عن المستحيل)", type: "tamtheleya", explanation: "استعارة تمثيلية: شبه حالة من يبحث عن المستحيل بهذه الصورة.", hint: "موقف مشهور للبحث الصعب." }
        ];

        const TF_QUESTIONS = [
            { text: "الاستعارة المكنية هي التي يُحذف فيها المشبه به، ونأتي بصفة من صفاته تدل عليه.", answer: true, explanation: "لأننا نحذف المشبه به ونأتي بصفة من صفاته، مثل: (بكى السحاب).", hint: "تذكر: مكنية = مخفية (نخفي المشبه به)." },
            { text: "الاستعارة التصريحية هي التي نُصرح فيها بلفظ المشبه، ونحذف المشبه به.", answer: false, explanation: "العكس هو الصحيح، فنحن نُصرح بلفظ (المشبه به) ونحذف (المشبه).", hint: "في التصريحية نصرّح بالمشبه به." },
            { text: "عبارة «ألقى الخطيب دررًا» (ويقصد كلمات) تُعد استعارة مكنية.", answer: false, explanation: "هي استعارة تصريحية، لأنه صرّح بالمشبه به (دررًا).", hint: "هل الدرر مذكورة صراحة أم مخفية؟" },
            { text: "الاستعارة التمثيلية غالبًا ما نجدها في الأمثال الشعبية والمواقف الحياتية.", answer: true, explanation: "لأنها تشبيه صورة كاملة بصورة وموقف بموقف.", hint: "الأمثال دائمًا تصور مواقف مركبة." },
            { text: "في عبارة «طار قلبي من الفرح»، نوع الاستعارة هو استعارة مكنية.", answer: true, explanation: "لأنه شبه القلب بطائر يطير، وحذف الطائر وأبقى صفة الطيران.", hint: "هل ذكرنا الطائر؟ أم أخفيناه وأتينا بصفته؟" },
            { text: "الاستعارة التصريحية تُبنى على الإبقاء على المشبه وحذف المشبه به.", answer: false, explanation: "هذا تعريف الاستعارة المكنية، أما التصريحية فنصرح بالمشبه به.", hint: "اقرأ العبارة جيداً، هناك عكس للمفاهيم." },
            { text: "الاستعارة هي في الأصل تشبيه بليغ حُذف أحد طرفيه.", answer: true, explanation: "هذه هي القاعدة الأساسية للاستعارة.", hint: "في الاستعارة نحذف المشبه أو المشبه به." },
            { text: "في الاستعارة التمثيلية نشبه كلمة مفردة بكلمة مفردة أخرى.", answer: false, explanation: "الاستعارة التمثيلية نشبه فيها (حالة كاملة) بـ (حالة كاملة).", hint: "التمثيلية تحتاج لمشهد أو صورة مركبة." },
            { text: "«رأيت بحرًا يتصدق على الفقراء» هي استعارة تصريحية.", answer: true, explanation: "لأنه صرح بالمشبه به (بحرًا) وحذف المشبه (الرجل الكريم).", hint: "كلمة (بحر) مذكورة صراحة مكان الرجل." },
            { text: "في الاستعارة المكنية يجب أن يرافقها دليل (قرينة) يمنع المعنى الحقيقي.", answer: true, explanation: "مثل الابتسام للفرصة، يمنع أن تكون الفرصة إنساناً حقيقياً.", hint: "لابد من خيال يمنع المعنى الحقيقي." }
        ];

        // ================= المكونات المشتركة =================

        // 1. الترويسة العلوية المتحركة مع التمرير
        const Header = () => (
            <div className="w-full text-center py-6 mt-4">
                <a href="https://www.youtube.com/egysalah" target="_blank" rel="noopener noreferrer" className="inline-flex items-center justify-center gap-3 text-3xl md:text-4xl font-bold text-violet-700 hover:text-violet-900 transition-colors decoration-violet-300 hover:underline underline-offset-8 mb-2">
                    <IconYoutube className="text-rose-600 w-10 h-10" />
                    العربية السهلة
                </a>
                <h2 className="text-xl md:text-2xl font-bold text-gray-700 mt-2">محمود صلاح</h2>
            </div>
        );

        // 2. شريط التنقل المتحرك (غير ثابت)
        const NavigationBar = ({ activeTab, changeTab }) => {
            const navItems = [
                { id: 'welcome', label: 'الرئيسية', theme: 'violet' },
                { id: 'quiz', label: 'اختر الإجابة', theme: 'violet' },
                { id: 'classify', label: 'التصنيف', theme: 'cyan' },
                { id: 'tf', label: 'صواب وخطأ', theme: 'rose' }
            ];

            return (
                <div className="w-full mb-8">
                    <div className="container mx-auto px-2">
                        <div className="flex justify-start md:justify-center gap-3 overflow-x-auto py-3 no-scrollbar">
                            {navItems.map(item => {
                                let baseClass = "px-6 py-3 rounded-full font-bold text-base md:text-lg whitespace-nowrap transition-all cursor-pointer border-2 outline-none ";
                                let activeClass = "";
                                
                                if (item.theme === 'violet') {
                                    activeClass = activeTab === item.id ? "bg-violet-600 text-white border-violet-600 shadow-md" : "bg-white text-gray-700 hover:bg-violet-50 hover:text-violet-700 border-gray-200 hover:border-violet-300";
                                } else if (item.theme === 'cyan') {
                                    activeClass = activeTab === item.id ? "bg-cyan-600 text-white border-cyan-600 shadow-md" : "bg-white text-gray-700 hover:bg-cyan-50 hover:text-cyan-700 border-gray-200 hover:border-cyan-300";
                                } else if (item.theme === 'rose') {
                                    activeClass = activeTab === item.id ? "bg-rose-500 text-white border-rose-500 shadow-md" : "bg-white text-gray-700 hover:bg-rose-50 hover:text-rose-600 border-gray-200 hover:border-rose-300";
                                }

                                return (
                                    <button key={item.id} type="button" onClick={() => changeTab(item.id)} className={baseClass + activeClass}>
                                        {item.label}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        // 3. الشاشة الرئيسية
        const WelcomeSection = () => (
            <div className="text-center fade-in pb-12">
                <h1 className="text-4xl md:text-5xl lg:text-6xl font-extrabold text-slate-900 tracking-tight leading-normal mb-8">
                    أسرار البلاغة: <span className="text-violet-600">الاستعارة</span>
                </h1>
                <p className="text-xl md:text-2xl font-medium text-slate-700 max-w-3xl mx-auto leading-loose bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                    مرحباً بك يا بطل اللغة العربية!<br/>
                    اختر أحد التدريبات من الأعلى للبدء في اختبار معلوماتك حول الاستعارة (المكنية، التصريحية، والتمثيلية).
                </p>
            </div>
        );

        // 4. بطاقة السؤال الواحد (مستقلة للتعامل مع الإجابة والتغذية الفورية)
        const QuestionCard = ({ question, index, type, theme, onAnswerSubmit }) => {
            const [answered, setAnswered] = useState(false);
            const [selected, setSelected] = useState(null);
            const [showHint, setShowHint] = useState(false);

            const isCorrect = selected === question.correct || selected === question.answer || selected === question.type;

            let themeColor = "violet";
            if (theme === 'cyan') themeColor = "cyan";
            if (theme === 'rose') themeColor = "rose";

            const handleAnswer = (val) => {
                if (answered) return;
                setSelected(val);
                setAnswered(true);
                
                // التحقق من صحة الإجابة لتحديث الدرجة الإجمالية للقسم
                const isCorrectAnswer = val === question.correct || val === question.answer || val === question.type;
                if (onAnswerSubmit) onAnswerSubmit(isCorrectAnswer);
            };

            let buttons = [];

            if (type === 'quiz') {
                buttons = question.options.map((opt, idx) => {
                    let btnClass = "w-full text-right p-5 rounded-2xl border-2 transition-all text-xl font-semibold flex justify-between items-center ";
                    if (!answered) btnClass += `border-slate-200 hover:border-${themeColor}-400 hover:bg-${themeColor}-50 text-slate-800 bg-white cursor-pointer shadow-sm`;
                    else {
                        if (idx === question.correct) btnClass += "bg-emerald-50 border-emerald-500 text-emerald-900 shadow-md font-bold";
                        else if (idx === selected) btnClass += "bg-rose-50 border-rose-500 text-rose-900 shadow-md font-bold";
                        else btnClass += "bg-slate-50 border-slate-100 text-slate-400 opacity-50";
                    }
                    return (
                        <button key={idx} disabled={answered} onClick={() => handleAnswer(idx)} className={btnClass}>
                            <span>{opt}</span>
                            {answered && idx === question.correct && <IconCheckCircle className="w-8 h-8 text-emerald-600" />}
                            {answered && idx === selected && idx !== question.correct && <IconXCircle className="w-8 h-8 text-rose-500" />}
                        </button>
                    );
                });
            } else if (type === 'classify') {
                const opts = [{ label: "مكنية", val: "makneya" }, { label: "تصريحية", val: "tasreheya" }, { label: "تمثيلية", val: "tamtheleya" }];
                buttons = opts.map(opt => {
                    let btnClass = "py-4 px-2 text-center rounded-2xl border-2 transition-all text-xl font-semibold ";
                    if (!answered) btnClass += `border-slate-200 hover:border-cyan-400 hover:bg-cyan-50 text-slate-800 bg-white cursor-pointer shadow-sm`;
                    else {
                        if (opt.val === question.type) btnClass += "bg-emerald-50 border-emerald-500 text-emerald-900 shadow-md font-bold";
                        else if (opt.val === selected) btnClass += "bg-rose-50 border-rose-500 text-rose-900 shadow-md font-bold";
                        else btnClass += "bg-slate-50 border-slate-100 text-slate-400 opacity-50";
                    }
                    return <button key={opt.val} disabled={answered} onClick={() => handleAnswer(opt.val)} className={btnClass}>{opt.label}</button>;
                });
            } else if (type === 'tf') {
                const opts = [{ label: "صواب", val: true }, { label: "خطأ", val: false }];
                buttons = opts.map(opt => {
                    let btnClass = "py-5 text-center rounded-2xl border-2 transition-all text-2xl font-bold ";
                    if (!answered) btnClass += `border-slate-200 hover:border-rose-400 hover:bg-rose-50 text-slate-800 bg-white cursor-pointer shadow-sm`;
                    else {
                        if (opt.val === question.answer) btnClass += "bg-emerald-50 border-emerald-500 text-emerald-900 shadow-md";
                        else if (opt.val === selected) btnClass += "bg-rose-50 border-rose-500 text-rose-900 shadow-md";
                        else btnClass += "bg-slate-50 border-slate-100 text-slate-400 opacity-50";
                    }
                    return <button key={opt.label} disabled={answered} onClick={() => handleAnswer(opt.val)} className={btnClass}>{opt.label}</button>;
                });
            }

            return (
                <div className={`bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200 mb-8 relative fade-in`}>
                    <div className="flex justify-between items-center mb-6">
                        <span className={`font-bold text-lg text-${themeColor}-600 bg-${themeColor}-50 px-4 py-1 rounded-full`}>السؤال {toArabicNum(index + 1)}</span>
                        <button onClick={() => setShowHint(!showHint)} className="bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-700 px-4 py-2 rounded-full shadow-sm transition-all flex items-center gap-2 active:scale-95 group cursor-pointer" title="تلميح للحل">
                            <IconLightbulb className="w-5 h-5 md:w-6 md:h-6 group-hover:text-amber-500 transition-colors" />
                            <span className="font-bold text-sm md:text-base">تلميح</span>
                        </button>
                    </div>

                    <h2 className={`text-2xl md:text-3xl font-bold text-slate-900 mb-6 leading-loose whitespace-pre-line text-center bg-slate-50 p-6 rounded-2xl border border-slate-100`}>
                        {question.text}
                    </h2>

                    {showHint && (
                        <div className="bg-amber-50 text-amber-900 p-4 rounded-2xl mb-6 text-lg md:text-xl font-medium border border-amber-200 fade-in flex gap-3 items-start">
                            <span className="text-amber-500 font-bold text-xl">💡</span>
                            <span className="leading-relaxed">{question.hint}</span>
                        </div>
                    )}

                    <div className={type === 'quiz' ? 'space-y-4' : (type === 'classify' ? 'grid grid-cols-3 gap-3' : 'grid grid-cols-2 gap-4')}>
                        {buttons}
                    </div>

                    {answered && (
                        <div className={`mt-6 p-5 border-2 rounded-2xl fade-in shadow-sm ${isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`}>
                            <div className="flex items-center gap-3 mb-3 border-b pb-3" style={{borderColor: isCorrect ? 'rgba(16, 185, 129, 0.2)' : 'rgba(244, 63, 94, 0.2)'}}>
                                <div className={isCorrect ? "text-emerald-600" : "text-rose-600"}>
                                    {isCorrect ? <IconCheckCircle className="w-7 h-7" /> : <IconXCircle className="w-7 h-7" />}
                                </div>
                                <span className={`text-xl font-bold ${isCorrect ? 'text-emerald-800' : 'text-rose-800'}`}>
                                    {isCorrect ? 'إجابة صحيحة' : 'إجابة خاطئة'}
                                </span>
                            </div>
                            <div className="flex items-start gap-3 mt-2">
                                <IconSparkles className={`w-6 h-6 mt-1 ${isCorrect ? "text-emerald-500" : "text-rose-500"}`} />
                                <span className={`text-xl font-medium leading-loose ${isCorrect ? 'text-emerald-900' : 'text-rose-900'}`}>{question.explanation}</span>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // 5. المكون المجمع للقسم مع حساب الدرجات النهائية
        const SectionRenderer = ({ questions, type, theme }) => {
            const [key, setKey] = useState(0); 
            const [score, setScore] = useState(0);
            const [answeredCount, setAnsweredCount] = useState(0);

            const handleReset = () => {
                setKey(prev => prev + 1);
                setScore(0);
                setAnsweredCount(0);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleQuestionAnswered = (isCorrect) => {
                setAnsweredCount(prev => prev + 1);
                if (isCorrect) setScore(prev => prev + 1);
            };

            // ألوان التقييم النهائي
            const percentage = Math.round((score / questions.length) * 100);
            let resultMessage = "";
            let colorClass = "";
            let iconColor = "";

            if (percentage < 50) {
                resultMessage = "لا بأس، التدريب المستمر يجعلك أفضل! حاول مرة أخرى.";
                colorClass = "text-rose-600";
                iconColor = "text-rose-400";
            } else if (percentage < 85) {
                resultMessage = "جيد؛ أنت تفهم البلاغة بشكل جميل.";
                colorClass = theme === 'violet' ? 'text-violet-600' : theme === 'cyan' ? 'text-cyan-600' : 'text-rose-600';
                iconColor = theme === 'violet' ? 'text-violet-400' : theme === 'cyan' ? 'text-cyan-400' : 'text-rose-400';
            } else {
                resultMessage = "أداء مبهر! أنت خبير حقيقي في البلاغة.";
                colorClass = "text-emerald-600";
                iconColor = "text-emerald-400";
            }

            return (
                <div key={key} className="max-w-4xl mx-auto pb-12 fade-in">
                    
                    <div className="mb-6 flex justify-between items-center text-slate-500 font-bold px-2">
                        <span>أجب عن جميع الأسئلة لمعرفة نتيجتك الإجمالية</span>
                        <span>{toArabicNum(answeredCount)} / {toArabicNum(questions.length)}</span>
                    </div>

                    {questions.map((q, idx) => (
                        <QuestionCard 
                            key={idx} 
                            question={q} 
                            index={idx} 
                            type={type} 
                            theme={theme} 
                            onAnswerSubmit={handleQuestionAnswered} 
                        />
                    ))}
                    
                    {/* بطاقة النتيجة النهائية تظهر بعد إجابة جميع الأسئلة */}
                    {answeredCount === questions.length && (
                        <div className={`mt-10 p-8 md:p-12 text-center bg-white rounded-3xl shadow-sm border-2 border-${theme}-200 fade-in relative overflow-hidden`}>
                            <h3 className="text-3xl md:text-4xl font-bold mb-8 text-slate-800">نتيجتك في هذا القسم</h3>
                            
                            <div className="relative mb-6 flex justify-center">
                                <IconTrophy className={`w-32 h-32 md:w-40 md:h-40 ${iconColor} drop-shadow-xl`} />
                                <div className="absolute -top-2 ml-24 bg-amber-400 text-slate-900 w-14 h-14 rounded-full flex items-center justify-center font-bold text-xl shadow-xl transform rotate-12 border-4 border-white">
                                    {toArabicNum(percentage)}%
                                </div>
                            </div>

                            <div className={`text-6xl md:text-7xl font-black text-${theme}-600 mb-4 flex justify-center items-center gap-3`} style={{ direction: 'ltr' }}>
                                <span>{toArabicNum(score)}</span>
                                <span className="text-4xl text-slate-300 font-medium">/</span>
                                <span>{toArabicNum(questions.length)}</span>
                            </div>
                            <p className={`text-xl md:text-2xl font-bold mt-4 px-2 leading-loose ${colorClass}`}>
                                {resultMessage}
                            </p>
                        </div>
                    )}

                    <div className="flex justify-center mt-10">
                        <button onClick={handleReset} className={`bg-${theme}-600 hover:bg-${theme}-700 text-white text-xl md:text-2xl font-bold py-4 px-12 rounded-full shadow-md flex items-center gap-3 transition-transform hover:-translate-y-1 active:translate-y-1`}>
                            <IconRefresh className="w-7 h-7" />
                            <span>إعادة المحاولة</span>
                        </button>
                    </div>
                </div>
            );
        };

        // ================= المكون الأساسي للتطبيق =================
        function App() {
            const [activeTab, setActiveTab] = useState('welcome');

            const changeTab = (tabId) => {
                setActiveTab(tabId);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                <div className="w-full flex flex-col min-h-screen">
                    <Header />
                    <NavigationBar activeTab={activeTab} changeTab={changeTab} />
                    
                    <div className="container mx-auto px-4 md:px-8 max-w-5xl flex-grow">
                        {activeTab === 'welcome' && <WelcomeSection changeTab={changeTab} />}
                        {activeTab === 'quiz' && <SectionRenderer questions={QUIZ_QUESTIONS} type="quiz" theme="violet" />}
                        {activeTab === 'classify' && <SectionRenderer questions={CLASSIFY_PHRASES} type="classify" theme="cyan" />}
                        {activeTab === 'tf' && <SectionRenderer questions={TF_QUESTIONS} type="tf" theme="rose" />}
                    </div>

                    <footer className="mt-auto py-8 bg-white border-t border-gray-200 text-center shadow-sm">
                        <a href="https://www.youtube.com/egysalah" target="_blank" rel="noopener noreferrer" className="text-slate-600 hover:text-violet-700 font-bold text-lg md:text-xl transition-colors">
                            جميع الحقوق محفوظة لقناة العربية السهلة
                        </a>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
