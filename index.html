            { words: ["شاهدت", "أسدًا", "يطلق", "النار"], correctIndex: 1, explanation: "الاستعارة في (أسدًا)، يقصد جنديًا شجاعًا فصرح بالمشبه به.", hint: "حيوان مفترس لا يمكنه إطلاق النار في الحقيقة!" },
            { words: ["نطق", "الجدار", "بأمجادنا"], correctIndex: 0, explanation: "الاستعارة في (نطق)، شبه الجدار بإنسان يتكلم.", hint: "الجدار جماد، فما الكلمة التي جعلته كالبشر؟" },
            { words: ["بكت", "السماء", "على", "الشهيد"], correctIndex: 0, explanation: "الاستعارة في (بكت)، شبه السماء بإنسان يبكي.", hint: "السماء تمطر ولا تفعل هذا الفعل البشري." },
            { words: ["أمطرت", "العين", "لؤلؤًا"], correctIndex: 2, explanation: "الاستعارة في (لؤلؤًا)، يقصد الدموع الغالية.", hint: "ماذا يخرج من العين عند البكاء وشبهناه بحجر كريم؟" },
            { words: ["زأر", "الجندي", "في", "المعركة"], correctIndex: 0, explanation: "الاستعارة في (زأر)، شبه الجندي بأسد وحذف الأسد وأبقى صوته.", hint: "صوت الأسد الذي استعرناه للجندي." }
        ];

        const TF_QUESTIONS = [
            { text: "الاستعارة المكنية هي التي يُحذف فيها المشبه به، ونأتي بصفة من صفاته تدل عليه.", answer: true, explanation: "لأننا نحذف المشبه به ونأتي بصفة من صفاته، مثل: (بكى السحاب).", hint: "تذكر: مكنية = مخفية (نخفي المشبه به)." },
            { text: "الاستعارة التصريحية هي التي نُصرح فيها بلفظ المشبه، ونحذف المشبه به.", answer: false, explanation: "العكس هو الصحيح، فنحن نُصرح بلفظ (المشبه به) ونحذف (المشبه).", hint: "في التصريحية نصرّح بالمشبه به." },
            { text: "عبارة «ألقى الخطيب دررًا» (ويقصد كلمات) تُعد استعارة مكنية.", answer: false, explanation: "هي استعارة تصريحية، لأنه صرّح بالمشبه به (دررًا).", hint: "هل الدرر مذكورة صراحة أم مخفية؟" },
            { text: "الاستعارة التمثيلية غالبًا ما نجدها في الأمثال الشعبية والمواقف الحياتية.", answer: true, explanation: "لأنها تشبيه صورة كاملة بصورة وموقف بموقف.", hint: "الأمثال دائمًا تصور مواقف مركبة." },
            { text: "في عبارة «طار قلبي من الفرح»، نوع الاستعارة هو استعارة مكنية.", answer: true, explanation: "لأنه شبه القلب بطائر يطير، وحذف الطائر وأبقى صفة الطيران.", hint: "هل ذكرنا الطائر؟ أم أخفيناه وأتينا بصفته؟" },
            { text: "الاستعارة التصريحية تُبنى على الإبقاء على المشبه وحذف المشبه به.", answer: false, explanation: "هذا تعريف الاستعارة المكنية، أما التصريحية فنصرح بالمشبه به.", hint: "اقرأ العبارة جيدًا، هناك عكس للمفاهيم." },
            { text: "الاستعارة هي في الأصل تشبيه بليغ حُذف أحد طرفيه.", answer: true, explanation: "هذه هي القاعدة الأساسية للاستعارة.", hint: "في الاستعارة نحذف المشبه أو المشبه به." },
            { text: "في الاستعارة التمثيلية نشبه كلمة مفردة بكلمة مفردة أخرى.", answer: false, explanation: "الاستعارة التمثيلية نشبه فيها (حالة كاملة) بـ (حالة كاملة).", hint: "التمثيلية تحتاج لمشهد أو صورة مركبة." },
            { text: "«رأيت بحرًا يتصدق على الفقراء» هي استعارة تصريحية.", answer: true, explanation: "لأنه صرح بالمشبه به (بحرًا) وحذف المشبه (الرجل الكريم).", hint: "كلمة (بحر) مذكورة صراحة مكان الرجل." },
            { text: "في الاستعارة المكنية يجب أن يرافقها دليل (قرينة) يمنع المعنى الحقيقي.", answer: true, explanation: "مثل الابتسام للفرصة، يمنع أن تكون الفرصة إنسانًا حقيقيًا.", hint: "لابد من خيال يمنع المعنى الحقيقي." }
        ];

        const SECTIONS = [
            { id: 'intro', label: 'قبل أن نبدأ', theme: 'amber' },
            { id: 'classify', label: 'التصنيف', theme: 'cyan' },
            { id: 'spotting', label: 'صياد الكلمات', theme: 'indigo' },
            { id: 'quiz', label: 'اختر الإجابة', theme: 'violet' },
            { id: 'tf', label: 'صواب وخطأ', theme: 'rose' }
        ];

        // ================= كائن التطبيق الرئيسي (Vanilla JS Controller) =================
        const App = {
            state: {
                activeTab: 'intro',
                progress: {
                    intro: { answered: 0, total: 0, score: 0 },
                    classify: { answered: 0, total: CLASSIFY_PHRASES.length, score: 0 },
                    spotting: { answered: 0, total: SPOTTING_QUESTIONS.length, score: 0 },
                    quiz: { answered: 0, total: QUIZ_QUESTIONS.length, score: 0 },
                    tf: { answered: 0, total: TF_QUESTIONS.length, score: 0 }
                },
                // مساحات تخزين بيانات الأقسام الديناميكية
                quizData: [],
                tfData: [],
                spottingData: [],
                classifyData: {
                    questions: [],
                    currentIndex: 0,
                    status: 'idle', // idle, correct, incorrect
                    boxCounts: { makneya: 0, tasreheya: 0, tamtheleya: 0 },
                    animatingOut: false
                }
            },

            // --- التهيئة ---
            init() {
                this.initSectionData();
                this.renderLayout();
                this.updateUI();
            },

            initSectionData() {
                // قسم اختر الإجابة (خلط الأسئلة فقط وليس الاختيارات)
                this.state.quizData = shuffleArray(QUIZ_QUESTIONS).map((q, idx) => {
                    const mappedOptions = q.options.map((opt, oIdx) => ({ text: opt, isCorrect: oIdx === q.correct }));
                    return {
                        originalQuestion: q,
                        options: mappedOptions,
                        answered: false,
                        selectedOption: null,
                        showHint: false
                    };
                });

                // قسم صواب وخطأ (خلط الأسئلة فقط، الخيارات ثابتة)
                this.state.tfData = shuffleArray(TF_QUESTIONS).map(q => ({
                    originalQuestion: q,
                    options: [
                        { text: "صواب", isCorrect: true === q.answer },
                        { text: "خطأ", isCorrect: false === q.answer }
                    ],
                    answered: false,
                    selectedOption: null,
                    showHint: false
                }));

                // قسم صياد الكلمات
                this.state.spottingData = shuffleArray(SPOTTING_QUESTIONS).map(q => ({
                    originalQuestion: q,
                    answered: false,
                    selectedIndex: null,
                    showHint: false
                }));

                // قسم لعبة التصنيف (خلط الأسئلة فقط وليس الاختيارات/الصناديق)
                this.state.classifyData = {
                    questions: shuffleArray(CLASSIFY_PHRASES).map(q => ({ originalQuestion: q, showHint: false })),
                    currentIndex: 0,
                    status: 'idle',
                    boxCounts: { makneya: 0, tasreheya: 0, tamtheleya: 0 },
                    animatingOut: false
                };
            },

            // --- بناء الهيكل الأساسي للصفحة ---
            renderLayout() {
                const root = document.getElementById('app-root');
                root.innerHTML = `
                    <div class="w-full text-center py-6 bg-transparent">
                        <a href="https://www.youtube.com/egysalah" target="_blank" rel="noopener noreferrer" 
                           class="inline-flex items-center justify-center gap-2 text-2xl font-bold text-slate-900 mb-1">
                            <span>العربية السهلة</span>
                            ${ICONS.youtube}
                        </a>
                        <h2 class="text-lg font-bold text-slate-500">محمود صلاح</h2>
                    </div>
                    
                    <div id="sticky-tabs-container" class="sticky top-0 z-50 bg-[#f8fafc]/95 backdrop-blur-md shadow-sm border-b border-slate-200">
                        <div id="tabs-container" class="mx-auto w-max max-w-full overflow-x-auto px-4 no-scrollbar scroll-smooth">
                            <div id="tabs-wrapper" class="flex items-center gap-3 py-3 flex-nowrap"></div>
                        </div>
                        <div class="w-full h-[2px] bg-slate-200">
                            <div id="progress-bar" class="h-full transition-all duration-500 ease-out" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <main class="container mx-auto px-4 py-8 max-w-4xl flex-grow">
                        <div id="scroll-target" class="scroll-mt-20"></div>
                        
                        <div id="section-intro" class="hidden">
                            <h1 class="text-center text-2xl md:text-3xl font-semibold text-slate-700 mb-8">الاستعارة</h1>
                            ${this.renderIntroSectionHTML()}
                        </div>
                        
                        <div id="section-classify" class="hidden"></div>
                        <div id="section-spotting" class="hidden"></div>
                        <div id="section-quiz" class="hidden"></div>
                        <div id="section-tf" class="hidden"></div>
                        
                        <div id="final-evaluation-container"></div>
                    </main>

                    <footer class="mt-auto py-8 bg-white border-t border-slate-200 text-center">
                        <a href="https://www.youtube.com/egysalah" target="_blank" rel="noopener noreferrer" class="text-slate-400 text-sm font-medium block w-full">
                            جميع الحقوق محفوظة لقناة العربية السهلة
                        </a>
                    </footer>
                `;
            },

            // --- تحديث واجهة المستخدم (حسب الـ State) ---
            updateUI() {
                this.updateTabs();
                this.updateSectionsVisibility();
                
                // تحديث محتوى القسم النشط فقط (باستثناء المقدمة فهي ثابتة)
                if (this.state.activeTab === 'classify') {
                    document.getElementById('section-classify').innerHTML = this.renderClassifySectionHTML();
                } else if (this.state.activeTab === 'spotting') {
                    document.getElementById('section-spotting').innerHTML = this.renderStandardSectionHTML('spotting');
                } else if (this.state.activeTab === 'quiz') {
                    document.getElementById('section-quiz').innerHTML = this.renderStandardSectionHTML('quiz');
                } else if (this.state.activeTab === 'tf') {
                    document.getElementById('section-tf').innerHTML = this.renderStandardSectionHTML('tf');
                }

                this.checkFinalEvaluation();
            },

            updateTabs() {
                const wrapper = document.getElementById('tabs-wrapper');
                let html = '';
                
                SECTIONS.forEach(section => {
                    const isActive = this.state.activeTab === section.id;
                    const secProgress = this.state.progress[section.id];
                    const isDone = secProgress.total > 0 && secProgress.answered === secProgress.total;
                    
                    let activeClass = isActive ? `bg-${section.theme}-600 text-white border-${section.theme}-600 shadow-md` : "bg-white text-slate-600 border-slate-200";

                    html += `
                        <button id="tab-${section.id}" type="button" onclick="App.handleTabChange('${section.id}')" 
                                class="shrink-0 whitespace-nowrap px-6 py-2 rounded-full font-semibold text-lg md:text-xl border-2 transition-all flex items-center justify-center gap-2 ${activeClass}">
                            ${section.label}
                            ${isDone && !isActive ? ICONS.checkCircle : ''}
                        </button>
                    `;
                });
                
                wrapper.innerHTML = html;

                // تحديث شريط التقدم
                const currentProgress = this.state.progress[this.state.activeTab];
                const progressPercent = currentProgress.total > 0 ? (currentProgress.answered / currentProgress.total) * 100 : 0;
                const progressBar = document.getElementById('progress-bar');
                const theme = SECTIONS.find(s => s.id === this.state.activeTab).theme;
                
                progressBar.className = `h-full transition-all duration-500 ease-out bg-${theme}-500`;
                progressBar.style.width = `${progressPercent}%`;
            },

            updateSectionsVisibility() {
                SECTIONS.forEach(sec => {
                    const el = document.getElementById(`section-${sec.id}`);
                    if (el) {
                        el.className = this.state.activeTab === sec.id ? 'block' : 'hidden';
                    }
                });
            },

            // --- مولدات نصوص HTML للأقسام ---
            
            renderIntroSectionHTML() {
                return `
                    <div class="max-w-3xl mx-auto space-y-6 fade-in">
                        <div class="bg-white p-6 md:p-8 rounded-2xl border-2 border-amber-100 shadow-sm flex flex-col md:flex-row items-center md:items-start text-center md:text-right gap-6">
                            <div class="bg-amber-100 p-4 rounded-full shrink-0">${ICONS.hidden}</div>
                            <div>
                                <h3 class="text-2xl font-semibold text-slate-700 mb-3">١. الاستعارة المكنية</h3>
                                <p class="text-xl text-slate-600 leading-relaxed">
                                    هي التي نَحْذِفُ فيها (المشبه به) ونأتي بصفة من صفاته تدل عليه.<br/>
                                    <span class="text-amber-600 font-semibold">مثال:</span> طار الخبر في المدينة. (شبهنا الخبر بطائر، وحذفنا الطائر وأبقينا صفة الطيران).
                                </p>
                            </div>
                        </div>

                        <div class="bg-white p-6 md:p-8 rounded-2xl border-2 border-violet-100 shadow-sm flex flex-col md:flex-row items-center md:items-start text-center md:text-right gap-6">
                            <div class="bg-violet-100 p-4 rounded-full shrink-0">${ICONS.loud}</div>
                            <div>
                                <h3 class="text-2xl font-semibold text-slate-700 mb-3">٢. الاستعارة التصريحية</h3>
                                <p class="text-xl text-slate-600 leading-relaxed">
                                    هي التي نُصَرِّحُ فيها بلفظ (المشبه به) ونحذف (المشبه).<br/>
                                    <span class="text-violet-600 font-semibold">مثال:</span> عبر أسودنا القناة. (شبهنا الجنود بالأسود، وصرّحنا بكلمة أسود).
                                </p>
                            </div>
                        </div>

                        <div class="bg-white p-6 md:p-8 rounded-2xl border-2 border-cyan-100 shadow-sm flex flex-col md:flex-row items-center md:items-start text-center md:text-right gap-6">
                            <div class="bg-cyan-100 p-4 rounded-full shrink-0">${ICONS.scene}</div>
                            <div>
                                <h3 class="text-2xl font-semibold text-slate-700 mb-3">٣. الاستعارة التمثيلية</h3>
                                <p class="text-xl text-slate-600 leading-relaxed">
                                    هي تشبيه حالة كاملة بحالة أخرى كاملة (تكثر في الأمثال).<br/>
                                    <span class="text-cyan-600 font-semibold">مثال:</span> لمن يبذل جهدًا بلا فائدة: "أنت تنفخ في رماد".
                                </p>
                            </div>
                        </div>

                        <div class="flex justify-center mt-10 pt-4">
                            <button onclick="App.handleNextSection()" class="bg-emerald-600 text-white font-semibold text-xl py-4 px-12 rounded-full shadow-md flex items-center gap-3 active:scale-95 transition-transform">
                                هيا نبدأ التدريبات
                                ${ICONS.arrowLeft}
                            </button>
                        </div>
                    </div>
                `;
            },

            renderStandardSectionHTML(sectionId) {
                const sectionData = SECTIONS.find(s => s.id === sectionId);
                const progress = this.state.progress[sectionId];
                const isComplete = progress.total > 0 && progress.answered === progress.total;
                const questions = this.state[`${sectionId}Data`];
                
                let html = '';
                
                questions.forEach((q, idx) => {
                    if (sectionId === 'spotting') {
                        html += this.renderSpottingCard(q, idx, sectionData.theme, sectionId);
                    } else {
                        html += this.renderQuestionCard(q, idx, sectionId, sectionData.theme);
                    }
                });

                if (isComplete) {
                    html += `
                        <div class="mt-12 p-8 md:p-10 bg-white border-2 border-${sectionData.theme}-200 rounded-2xl shadow-sm text-center fade-in max-w-2xl mx-auto w-full">
                            <h3 class="text-2xl md:text-3xl font-semibold text-slate-700 mb-6">نتيجتك في قسم (${sectionData.label})</h3>
                            <div class="text-5xl font-bold text-${sectionData.theme}-600" style="direction: ltr">
                                ${toArabicNum(progress.score)} <span class="text-4xl text-slate-300 font-medium">/</span> ${toArabicNum(progress.total)}
                            </div>
                        </div>
                    `;
                }

                html += this.renderSectionFooterControls(sectionId, isComplete);
                return html;
            },

            renderQuestionCard(qState, idx, sectionId, theme) {
                const { originalQuestion: q, options, answered, selectedOption, showHint } = qState;
                const isSelectedCorrect = selectedOption && selectedOption.isCorrect;
                
                let ringClass = '';
                if (answered) {
                    ringClass = isSelectedCorrect ? 'ring-2 ring-emerald-400' : 'ring-2 ring-rose-400';
                }

                let optionsHTML = '';
                options.forEach((opt, optIdx) => {
                    let btnClass = `w-full p-4 md:p-5 rounded-xl border-2 transition-all font-semibold text-lg md:text-xl flex items-center gap-3 ${sectionId === 'quiz' ? 'justify-start' : 'justify-center'} `;
                    
                    if (!answered) {
                        btnClass += `border-slate-200 bg-white text-slate-600 active:scale-95 hover:bg-slate-50 cursor-pointer`;
                    } else {
                        if (opt.isCorrect) btnClass += "bg-emerald-50 border-emerald-500 text-emerald-800 shadow-sm";
                        else if (selectedOption === opt) btnClass += "bg-rose-50 border-rose-500 text-rose-800 shadow-sm";
                        else btnClass += "bg-slate-50 border-slate-100 text-slate-400 opacity-60";
                        btnClass += " cursor-default";
                    }

                    // ترقيم ديناميكي لأسئلة الاختيار من متعدد فقط (quiz)
                    let numberingHTML = '';
                    if (sectionId === 'quiz') {
                        let numClass = `w-8 h-8 md:w-10 md:h-10 flex items-center justify-center rounded-full text-base md:text-lg font-bold shrink-0 transition-colors `;
                        if (answered) {
                            numClass += opt.isCorrect ? 'bg-emerald-200 text-emerald-800' : (selectedOption === opt ? 'bg-rose-200 text-rose-800' : 'bg-slate-200 text-slate-500');
                        } else {
                            numClass += `bg-${theme}-100 text-${theme}-700`;
                        }
                        numberingHTML = `<div class="${numClass}">${toArabicNum(optIdx + 1)}</div>`;
                    }

                    optionsHTML += `
                        <button ${answered ? 'disabled' : ''} onclick="App.handleAnswer('${sectionId}', ${idx}, ${optIdx})" class="${btnClass}">
                            ${numberingHTML}
                            <span class="relative z-10 flex-grow ${sectionId === 'quiz' ? 'text-right' : 'text-center'}">${opt.text}</span>
                            ${answered && opt.isCorrect ? ICONS.checkCircle : ''}
                            ${answered && selectedOption === opt && !opt.isCorrect ? ICONS.xCircle : ''}
                        </button>
                    `;
                });

                return `
                    <div id="${sectionId}-q-${idx}" class="bg-white rounded-2xl p-6 md:p-10 shadow-sm border border-slate-200 mb-8 relative fade-in transition-all duration-300 min-h-[450px] md:min-h-[480px] flex flex-col justify-start ${ringClass}">
                        <div class="flex justify-between items-center mb-6">
                            <span class="font-semibold text-lg md:text-xl text-${theme}-700 bg-${theme}-100 px-5 py-2 rounded-full">
                                السؤال ${toArabicNum(idx + 1)}
                            </span>
                            <button onclick="App.toggleHint('${sectionId}', ${idx})" class="flex items-center gap-2 px-4 py-2 rounded-full text-lg md:text-xl font-semibold border transition-all active:scale-95 ${showHint ? 'bg-amber-100 border-amber-300 text-amber-800' : 'bg-white border-amber-200 text-amber-700 hover:bg-amber-50'}">
                                ${ICONS.lightbulb} تلميح
                            </button>
                        </div>
                        <h3 class="text-2xl md:text-3xl font-semibold text-slate-700 mb-8 leading-relaxed whitespace-pre-line text-center bg-slate-50 p-6 rounded-xl border border-slate-100">
                            ${q.text}
                        </h3>
                        
                        ${showHint ? `
                            <div class="bg-amber-50 text-amber-900 p-5 rounded-xl mb-6 text-lg md:text-xl font-medium border border-amber-200 fade-in flex gap-3 items-start">
                                <span class="text-amber-500 font-semibold text-xl md:text-2xl leading-none">💡</span>
                                <span class="leading-relaxed">${q.hint}</span>
                            </div>
                        ` : ''}
                        
                        <div class="grid gap-4 mx-auto w-full max-w-2xl flex-grow ${sectionId === 'quiz' ? 'grid-cols-1 content-start' : 'grid-cols-1 md:grid-cols-2 content-center'}">
                            ${optionsHTML}
                        </div>
                        
                        ${answered ? `
                            <div class="mt-8 p-5 rounded-xl border fade-in ${isSelectedCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}">
                                <div class="flex items-center gap-2 mb-3 font-bold text-xl md:text-2xl ${isSelectedCorrect ? 'text-emerald-700' : 'text-rose-700'}">
                                    ${isSelectedCorrect ? ICONS.checkCircleLarge : ICONS.xCircleLarge}
                                    <span>${isSelectedCorrect ? 'إجابة صحيحة' : 'إجابة خاطئة'}</span>
                                </div>
                                <div class="flex items-start gap-3 mt-3">
                                    ${isSelectedCorrect ? ICONS.sparklesEmerald : ICONS.sparklesRose}
                                    <span class="text-lg md:text-xl font-semibold leading-relaxed ${isSelectedCorrect ? 'text-emerald-800' : 'text-rose-800'}">
                                        ${q.explanation}
                                    </span>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            },

            renderSpottingCard(qState, idx, theme, sectionId) {
                const { originalQuestion: q, answered, selectedIndex, showHint } = qState;
                const isCorrectAnswer = selectedIndex === q.correctIndex;
                
                let ringClass = answered ? (isCorrectAnswer ? 'ring-2 ring-emerald-400' : 'ring-2 ring-rose-400') : '';

                let wordsHTML = '';
                q.words.forEach((word, wIdx) => {
                    const isSelected = selectedIndex === wIdx;
                    const isCorrect = wIdx === q.correctIndex;
                    
                    let wordClass = "px-4 md:px-6 py-3 md:py-4 text-2xl md:text-3xl font-bold rounded-xl transition-all duration-300 select-none ";
                    if (!answered) {
                        wordClass += `bg-white border-2 border-slate-200 text-slate-700 hover:border-${theme}-300 hover:bg-${theme}-50 hover:-translate-y-1 hover:shadow-md active:scale-95 cursor-pointer`;
                    } else {
                        if (isSelected && isCorrect) wordClass += "bg-emerald-500 text-white border-2 border-emerald-600 shadow-md scale-105";
                        else if (isSelected && !isCorrect) wordClass += "bg-rose-500 text-white border-2 border-rose-600 shadow-md scale-105";
                        else if (!isSelected && isCorrect) wordClass += "bg-emerald-50 text-emerald-700 border-2 border-emerald-300 ring-2 ring-emerald-200";
                        else wordClass += "bg-slate-50 border-2 border-slate-100 text-slate-400 opacity-50 cursor-default";
                    }

                    wordsHTML += `
                        <span onclick="App.handleSpottingClick(${idx}, ${wIdx})" class="${wordClass}">
                            ${word}
                        </span>
                    `;
                });

                return `
                    <div id="spotting-q-${idx}" class="bg-white rounded-2xl p-6 md:p-10 shadow-sm border border-slate-200 mb-8 relative fade-in transition-all duration-300 min-h-[450px] md:min-h-[480px] flex flex-col justify-start ${ringClass}">
                        <div class="flex justify-between items-center mb-6">
                            <span class="font-semibold text-lg md:text-xl text-${theme}-700 bg-${theme}-100 px-5 py-2 rounded-full">
                                السؤال ${toArabicNum(idx + 1)}
                            </span>
                            <button onclick="App.toggleHint('spotting', ${idx})" class="flex items-center gap-2 px-4 py-2 rounded-full text-lg md:text-xl font-semibold border transition-all active:scale-95 ${showHint ? 'bg-amber-100 border-amber-300 text-amber-800' : 'bg-white border-amber-200 text-amber-700 hover:bg-amber-50'}">
                                ${ICONS.lightbulb} تلميح
                            </button>
                        </div>

                        <div class="text-center mb-8 flex-grow flex flex-col justify-center">
                            <p class="text-slate-500 font-semibold text-lg md:text-xl mb-6">
                                انقر على الكلمة التي تمثل <span class="text-${theme}-600 font-bold">الاستعارة</span> في الجملة الآتية:
                            </p>
                            <div class="flex flex-wrap justify-center items-center gap-3 md:gap-4 p-6 md:p-8 bg-slate-50 rounded-2xl border border-slate-100 leading-loose">
                                ${wordsHTML}
                            </div>
                        </div>

                        ${showHint ? `
                            <div class="bg-amber-50 text-amber-900 p-5 rounded-xl mb-6 text-lg md:text-xl font-medium border border-amber-200 fade-in flex gap-3 items-start">
                                <span class="text-amber-500 font-semibold text-xl md:text-2xl leading-none">💡</span>
                                <span class="leading-relaxed">${q.hint}</span>
                            </div>
                        ` : ''}

                        ${answered ? `
                            <div class="mt-8 p-5 rounded-xl border fade-in ${isCorrectAnswer ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}">
                                <div class="flex items-center gap-2 mb-3 font-bold text-xl md:text-2xl ${isCorrectAnswer ? 'text-emerald-700' : 'text-rose-700'}">
                                    ${isCorrectAnswer ? ICONS.checkCircleLarge : ICONS.xCircleLarge}
                                    <span>${isCorrectAnswer ? 'إجابة صحيحة' : 'إجابة خاطئة'}</span>
                                </div>
                                <div class="flex items-start gap-3 mt-3">
                                    ${isCorrectAnswer ? ICONS.sparklesEmerald : ICONS.sparklesRose}
                                    <span class="text-lg md:text-xl font-semibold leading-relaxed ${isCorrectAnswer ? 'text-emerald-800' : 'text-rose-800'}">
                                        ${q.explanation}
                                    </span>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            },

            renderClassifySectionHTML() {
                const theme = 'cyan';
                const state = this.state.classifyData;
                const { questions, currentIndex, status, boxCounts, animatingOut } = state;
                const isComplete = currentIndex >= questions.length;
                
                let html = '';

                if (!isComplete && questions[currentIndex]) {
                    const currentQuestion = questions[currentIndex].originalQuestion;
                    const showHint = questions[currentIndex].showHint;
                    
                    const boxes = [
                        { id: 'makneya', label: 'مكنية', colorClass: 'border-amber-200 text-amber-700 bg-amber-50', hoverClass: 'hover:border-amber-400 hover:bg-amber-100' },
                        { id: 'tasreheya', label: 'تصريحية', colorClass: 'border-violet-200 text-violet-700 bg-violet-50', hoverClass: 'hover:border-violet-400 hover:bg-violet-100' },
                        { id: 'tamtheleya', label: 'تمثيلية', colorClass: 'border-cyan-200 text-cyan-700 bg-cyan-50', hoverClass: 'hover:border-cyan-400 hover:bg-cyan-100' }
                    ];

                    let boxesHTML = '';
                    boxes.forEach(b => {
                        let btnClass = `flex-1 flex flex-col items-center justify-center p-3 md:p-6 border-2 md:border-4 rounded-2xl md:rounded-3xl transition-all duration-300 ${b.colorClass} `;
                        if (status === 'idle') {
                            btnClass += `${b.hoverClass} hover:-translate-y-2 cursor-pointer shadow-sm hover:shadow-md`;
                        } else {
                            btnClass += `opacity-60 cursor-default grayscale-[30%]`;
                        }
                        
                        boxesHTML += `
                            <button ${status !== 'idle' ? 'disabled' : ''} onclick="App.handleSortClick('${b.id}')" class="${btnClass}">
                                ${ICONS.tray}
                                <span class="font-bold text-sm md:text-2xl mb-2 md:mb-3">${b.label}</span>
                                <div class="bg-white/90 px-3 md:px-4 py-1 rounded-full shadow-inner font-black text-sm md:text-xl border border-white/50">
                                    ${toArabicNum(boxCounts[b.id])}
                                </div>
                            </button>
                        `;
                    });

                    html += `
                        <div class="flex flex-col items-center fade-in">
                            <div class="w-full max-w-2xl bg-white p-6 md:p-10 rounded-3xl shadow-lg border-2 border-slate-200 transition-all duration-300 relative z-10 min-h-[380px] md:min-h-[420px] flex flex-col justify-start ${animatingOut ? 'fly-out' : 'fade-in'}">
                                <div class="flex justify-end mb-4">
                                    <button onclick="App.toggleHint('classify', ${currentIndex})" class="flex items-center gap-2 px-3 py-1.5 rounded-full text-sm md:text-base font-semibold border transition-all active:scale-95 ${showHint ? 'bg-amber-100 border-amber-300 text-amber-800' : 'bg-white border-amber-200 text-amber-700 hover:bg-amber-50'}">
                                        ${ICONS.lightbulb} تلميح
                                    </button>
                                </div>
                                
                                <div class="flex-grow flex flex-col justify-center">
                                    <h3 class="text-2xl md:text-3xl font-bold text-center leading-loose text-slate-800 mb-2">
                                        «${currentQuestion.text}»
                                    </h3>

                                    ${showHint && status === 'idle' ? `
                                        <div class="mt-4 bg-amber-50 text-amber-900 p-4 rounded-xl text-base md:text-lg font-medium border border-amber-200 fade-in flex gap-2 items-start">
                                            <span class="text-amber-500 font-semibold leading-none">💡</span>
                                            <span class="leading-relaxed">${currentQuestion.hint}</span>
                                        </div>
                                    ` : ''}

                                    ${status !== 'idle' ? `
                                        <div class="mt-8 p-5 rounded-2xl border-2 fade-in ${status === 'correct' ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}">
                                            <div class="flex items-center justify-center gap-2 mb-3 font-bold text-xl md:text-2xl ${status === 'correct' ? 'text-emerald-700' : 'text-rose-700'}">
                                                ${status === 'correct' ? ICONS.checkCircleLarge : ICONS.xCircleLarge}
                                                <span>${status === 'correct' ? 'إجابة صحيحة' : 'إجابة خاطئة'}</span>
                                            </div>
                                            <p class="text-center text-lg md:text-xl font-semibold leading-relaxed mb-6 ${status === 'correct' ? 'text-emerald-800' : 'text-rose-800'}">
                                                ${currentQuestion.explanation}
                                            </p>
                                            <div class="flex justify-center">
                                                <button onclick="App.handleSortContinue()" class="px-8 py-3 text-white font-bold text-lg md:text-xl rounded-full active:scale-95 transition-transform shadow-md ${status === 'correct' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-rose-600 hover:bg-rose-700'}">
                                                    متابعة
                                                </button>
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>

                            <div class="flex flex-row w-full max-w-3xl gap-2 md:gap-6 mt-6 md:mt-12 relative z-0">
                                ${boxesHTML}
                            </div>

                            <div class="mt-8 text-slate-500 font-bold bg-white px-6 py-2 rounded-full shadow-sm border border-slate-100 text-sm md:text-base">
                                البطاقة ${toArabicNum(currentIndex + 1)} من ${toArabicNum(questions.length)}
                            </div>
                        </div>
                    `;
                }

                if (isComplete) {
                    const progress = this.state.progress['classify'];
                    html += `
                        <div class="mt-12 p-8 md:p-10 bg-white border-2 border-${theme}-200 rounded-2xl shadow-sm text-center fade-in max-w-2xl mx-auto w-full">
                            <h3 class="text-2xl md:text-3xl font-semibold text-slate-700 mb-6">نتيجتك في قسم (لعبة التصنيف)</h3>
                            <div class="text-5xl font-bold text-${theme}-600" style="direction: ltr">
                                ${toArabicNum(progress.score)} <span class="text-4xl text-slate-300 font-medium">/</span> ${toArabicNum(progress.total)}
                            </div>
                        </div>
                    `;
                }

                html += this.renderSectionFooterControls('classify', isComplete);
                return html;
            },

            renderSectionFooterControls(sectionId, isComplete) {
                const sectionData = SECTIONS.find(s => s.id === sectionId);
                const isLast = sectionId === SECTIONS[SECTIONS.length - 1].id;
                
                return `
                    <div class="mt-8 flex flex-col md:flex-row justify-center items-center gap-4 max-w-2xl mx-auto w-full">
                        <button onclick="App.handleResetSection('${sectionId}')" class="w-full md:w-auto px-8 py-3 md:py-4 rounded-full font-semibold text-lg md:text-xl text-slate-600 bg-slate-100 hover:bg-slate-200 active:scale-95 transition-transform flex items-center justify-center gap-3">
                            ${ICONS.refresh} إعادة المحاولة
                        </button>

                        ${!isLast ? `
                            <button onclick="App.handleNextSection()" class="w-full md:w-auto px-8 md:px-10 py-3 md:py-4 rounded-full font-semibold text-lg md:text-xl text-white shadow-md transition-transform flex items-center justify-center gap-3 active:scale-95 bg-${sectionData.theme}-600 hover:bg-${sectionData.theme}-700">
                                القسم التالي ${ICONS.arrowLeft}
                            </button>
                        ` : ''}
                    </div>
                `;
            },

            // --- المعالجات والأحداث (Event Handlers) ---
            
            toggleHint(sectionId, idx) {
                if (sectionId === 'classify') {
                    this.state.classifyData.questions[idx].showHint = !this.state.classifyData.questions[idx].showHint;
                    this.updateUI();
                } else {
                    const qState = this.state[`${sectionId}Data`][idx];
                    qState.showHint = !qState.showHint;
                    // تحديث الكارت فقط لتحسين الأداء
                    const cardHtml = sectionId === 'spotting' ? 
                        this.renderSpottingCard(qState, idx, SECTIONS.find(s=>s.id===sectionId).theme, sectionId) :
                        this.renderQuestionCard(qState, idx, sectionId, SECTIONS.find(s=>s.id===sectionId).theme);
                    document.getElementById(`${sectionId}-q-${idx}`).outerHTML = cardHtml;
                }
            },

            handleAnswer(sectionId, qIndex, optIndex) {
                const qState = this.state[`${sectionId}Data`][qIndex];
                if (qState.answered) return;
                
                const selectedOption = qState.options[optIndex];
                qState.answered = true;
                qState.selectedOption = selectedOption;
                
                this.recordProgress(sectionId, selectedOption.isCorrect);
                
                // تحديث بطاقة السؤال محلياً
                const theme = SECTIONS.find(s => s.id === sectionId).theme;
                document.getElementById(`${sectionId}-q-${qIndex}`).outerHTML = this.renderQuestionCard(qState, qIndex, sectionId, theme);
                
                this.updateTabs();
                this.checkFinalEvaluation();
            },

            handleSpottingClick(qIndex, wIndex) {
                const qState = this.state.spottingData[qIndex];
                if (qState.answered) return;
                
                qState.answered = true;
                qState.selectedIndex = wIndex;
                
                const isCorrect = wIndex === qState.originalQuestion.correctIndex;
                this.recordProgress('spotting', isCorrect);
                
                const theme = SECTIONS.find(s => s.id === 'spotting').theme;
                document.getElementById(`spotting-q-${qIndex}`).outerHTML = this.renderSpottingCard(qState, qIndex, theme, 'spotting');
                
                this.updateTabs();
                this.checkFinalEvaluation();
            },

            handleSortClick(type) {
                const state = this.state.classifyData;
                if (state.status !== 'idle') return;

                const currentQ = state.questions[state.currentIndex].originalQuestion;
                const isCorrect = type === currentQ.type;
                
                state.status = isCorrect ? 'correct' : 'incorrect';
                if (isCorrect) state.boxCounts[type]++;
                
                this.recordProgress('classify', isCorrect);
                this.updateUI();
            },

            handleSortContinue() {
                const state = this.state.classifyData;
                state.animatingOut = true;
                this.updateUI();
                
                setTimeout(() => {
                    state.currentIndex++;
                    state.status = 'idle';
                    state.animatingOut = false;
                    this.updateUI();
                }, 300);
            },

            recordProgress(sectionId, isCorrect) {
                this.state.progress[sectionId].answered++;
                if (isCorrect) this.state.progress[sectionId].score++;
            },

            // --- منطق التمرير الاحترافي والمتقدم ---
            scrollToContent() {
                requestAnimationFrame(() => {
                    // استخدام setTimeout لضمان اكتمال بناء الـ DOM (Reflow) قبل حساب المسافة - لا تتجاوز 50ms
                    setTimeout(() => {
                        const target = document.getElementById('scroll-target');
                        if (target) {
                            const stickyTabs = document.getElementById('sticky-tabs-container');
                            const headerOffset = stickyTabs ? stickyTabs.offsetHeight : 80;
                            
                            const elementPosition = target.getBoundingClientRect().top;
                            const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                            
                            window.scrollTo({
                                top: offsetPosition,
                                behavior: 'smooth'
                            });
                        }
                    }, 30); 
                });
            },

            scrollTabIntoView(tabId) {
                requestAnimationFrame(() => {
                    setTimeout(() => {
                        const tabBtn = document.getElementById(`tab-${tabId}`);
                        const container = document.getElementById('tabs-container');
                        
                        if (tabBtn && container) {
                            const containerRect = container.getBoundingClientRect();
                            const btnRect = tabBtn.getBoundingClientRect();
                            
                            // حساب دقيق يعتمد على إحداثيات الشاشة للتمرير الأفقي الآمن مع الـ RTL
                            const scrollDelta = (btnRect.left + btnRect.width / 2) - (containerRect.left + containerRect.width / 2);
                            container.scrollBy({ left: scrollDelta, behavior: 'smooth' });
                        }
                    }, 30);
                });
            },

            handleTabChange(tabId) {
                this.state.activeTab = tabId;
                this.updateUI();
                this.scrollToContent();
                this.scrollTabIntoView(tabId);
            },

            handleNextSection() {
                const currentIndex = SECTIONS.findIndex(s => s.id === this.state.activeTab);
                if (currentIndex < SECTIONS.length - 1) {
                    this.handleTabChange(SECTIONS[currentIndex + 1].id);
                }
            },

            handleResetSection(sectionId) {
                // تصفير بيانات القسم المعني فقط
                this.state.progress[sectionId].answered = 0;
                this.state.progress[sectionId].score = 0;
                
                if (sectionId === 'quiz' || sectionId === 'tf' || sectionId === 'spotting') {
                    // إعادة خلط الأسئلة فقط
                    let sourceData = sectionId === 'quiz' ? QUIZ_QUESTIONS : (sectionId === 'tf' ? TF_QUESTIONS : SPOTTING_QUESTIONS);
                    let newData = shuffleArray(sourceData).map(q => {
                        let options = [];
                        if (sectionId === 'quiz') {
                            // تثبيت ترتيب الاختيارات
                            options = q.options.map((opt, oIdx) => ({ text: opt, isCorrect: oIdx === q.correct }));
                        } else if (sectionId === 'tf') {
                            options = [
                                { text: "صواب", isCorrect: true === q.answer },
                                { text: "خطأ", isCorrect: false === q.answer }
                            ];
                        }
                        return { originalQuestion: q, options, answered: false, selectedOption: null, selectedIndex: null, showHint: false };
                    });
                    this.state[`${sectionId}Data`] = newData;
                } else if (sectionId === 'classify') {
                    // إعادة خلط الأسئلة فقط في قسم التصنيف
                    this.state.classifyData = {
                        questions: shuffleArray(CLASSIFY_PHRASES).map(q => ({ originalQuestion: q, showHint: false })),
                        currentIndex: 0,
                        status: 'idle',
                        boxCounts: { makneya: 0, tasreheya: 0, tamtheleya: 0 },
                        animatingOut: false
                    };
                }
                
                this.updateUI();
                this.scrollToContent();
            },

            handleGlobalRestart() {
                // تصفير التقدم الشامل
                this.state.progress = {
                    intro: { answered: 0, total: 0, score: 0 },
                    classify: { answered: 0, total: CLASSIFY_PHRASES.length, score: 0 },
                    spotting: { answered: 0, total: SPOTTING_QUESTIONS.length, score: 0 },
                    quiz: { answered: 0, total: QUIZ_QUESTIONS.length, score: 0 },
                    tf: { answered: 0, total: TF_QUESTIONS.length, score: 0 }
                };
                
                this.initSectionData(); // توليد وخلط جديد لجميع الأسئلة
                this.state.activeTab = SECTIONS[0].id;
                this.updateUI();
                
                // التمرير لأعلى الصفحة
                requestAnimationFrame(() => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            },

            // --- التقييم النهائي ---
            checkFinalEvaluation() {
                const isAllComplete = Object.values(this.state.progress).filter(p => p.total > 0).every(p => p.answered === p.total);
                const container = document.getElementById('final-evaluation-container');
                
                if (isAllComplete && this.state.activeTab !== 'intro') {
                    const totalScore = Object.values(this.state.progress).reduce((acc, p) => acc + p.score, 0);
                    const totalQuestions = Object.values(this.state.progress).reduce((acc, p) => acc + p.total, 0);
                    const percentage = Math.round((totalScore / totalQuestions) * 100);
                    
                    let message = "", color = "";
                    if (percentage < 60) { message = "تحتاج إلى مزيد من التدريب، لا تيأس وحاول مرة أخرى!"; color = "text-rose-600"; }
                    else if (percentage < 85) { message = "أداء رائع! مستواك جيد جدًا في البلاغة."; color = "text-violet-600"; }
                    else { message = "أداء استثنائي! أنت بطل حقيقي وخبير في الاستعارة."; color = "text-emerald-600"; }

                    container.innerHTML = `
                        <div id="final-eval-box" class="mt-12 bg-white p-8 md:p-12 rounded-3xl shadow-lg border-2 border-amber-200 text-center fade-in">
                            ${ICONS.medal}
                            <h2 class="text-3xl md:text-4xl font-bold text-slate-700 mb-4">التقييم النهائي</h2>
                            <div class="text-6xl md:text-8xl font-bold mb-6 text-slate-700" style="direction: ltr">
                                <span class="${color}">${toArabicNum(totalScore)}</span>
                                <span class="text-slate-300 text-5xl font-medium">/</span>
                                <span class="text-slate-500">${toArabicNum(totalQuestions)}</span>
                            </div>
                            <div class="inline-block bg-amber-100 text-amber-800 px-6 py-2 rounded-full font-semibold text-xl md:text-2xl mb-6">
                                النسبة المئوية: ${toArabicNum(percentage)}%
                            </div>
                            <p class="text-xl md:text-2xl font-semibold leading-relaxed ${color} mb-10">${message}</p>
                            <button onclick="App.handleGlobalRestart()" class="px-8 md:px-10 py-3 md:py-4 rounded-full font-semibold text-xl md:text-2xl text-white bg-slate-700 hover:bg-slate-800 shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-3 mx-auto">
                                ${ICONS.refresh} ابدأ من جديد
                            </button>
                        </div>
                    `;

                    // التمركز الآلي والهادئ نحو التقييم النهائي
                    requestAnimationFrame(() => {
                        setTimeout(() => {
                            const evalBox = document.getElementById('final-eval-box');
                            if (evalBox) {
                                const rect = evalBox.getBoundingClientRect();
                                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                                const elementTop = rect.top + scrollTop;
                                const offset = (window.innerHeight - rect.height) / 2;
                                window.scrollTo({ top: elementTop - offset, behavior: 'smooth' });
                            }
                        }, 50);
                    });
                } else {
                    container.innerHTML = '';
                }
            }
        };

        // تشغيل التطبيق فور تحميل المستند
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });

    </script>
</body>
</html>
