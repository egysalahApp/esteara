            { text: "لمن يعود لعادة سيئة تركها: «رجعت حليمة لعادتها القديمة»\nهذه الصورة:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 2, explanation: "لأنه شبه موقف (من يعود لفعل تركه) بموقف المرأة (حليمة) في المثل الشهير.", hint: "هذا مثل شعبي، والأمثال دائمًا تمثل مواقف كاملة." },

            { text: "«افترس المرض جسد الرجل الضعيف»\nما نوع الاستعارة؟", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 0, explanation: "لأنه شبه المرض بحيوان مفترس، وحذف الحيوان وأبقى صفة الافتراس.", hint: "الافتراس صفة لشيء محذوف." },

            { text: "«أمطر الخطيب الحاضرين بلؤلؤٍ من كلماته»\nنوع الاستعارة:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 1, explanation: "لأنه شبه (الكلمات) باللؤلؤ، وحذف المشبه وصرّح بالمشبه به.", hint: "ماذا يخرج من فم الخطيب؟ كلمات أم لؤلؤ؟ الكلمة المصرح بها هي المفتاح." },

            { text: "شاهدت أسدًا يقود الطائرة الحربية", type: "tasreheya", explanation: "استعارة تصريحية: صرح بـ (أسد) وحذف المشبه وقصد الطيار الشجاع.", hint: "هل الأسد يقود طائرة؟ لقد تم التصريح بهذه الكلمة بدلاً من الطيار." },
            { text: "لمن يشتري المجهول: «أنت تشتري سمكًا في ماء»", type: "tamtheleya", explanation: "استعارة تمثيلية: تشبيه حالة (شراء المجهول) بحالة (شراء السمك قبل صيده).", hint: "موقف يشبه موقفًا في الحياة." },
            { text: "عضتنا الأيام بنابها القاسي", type: "makneya", explanation: "استعارة مكنية: شبه الأيام بحيوان مفترس، وحذفه وأبقى صفة العض.", hint: "الأيام ليس لها ناب. من صاحب الناب الذي اختفى هنا؟" },

            { text: "لمن يتردد: «أراك تقدم رجلًا وتؤخر أخرى»", type: "tamtheleya", explanation: "استعارة تمثيلية: تشبيه حالة المتردد بهذه الصورة.", hint: "هذه صورة حركية تمثل التردد وعدم الحسم." },
            { text: "زأر الجندي في وجه الأعداء", type: "makneya", explanation: "استعارة مكنية: شبه الجندي بأسد، وحذف المشبه به وأبقى صفة الزئير.", hint: "الزئير صفة لحيوان معين لم يذكر اسمه في الجملة." },

                                <div className="flex items-start gap-4 mt-2">
                                    <div className={isCorrect ? "text-emerald-600 mt-1" : "text-rose-600 mt-1"}><IconSparkles className="w-7 h-7" /></div>
                                    <span className={`text-xl md:text-2xl font-medium leading-loose ${isCorrect ? 'text-emerald-900' : 'text-rose-900'}`}>{q.explanation}</span>
                                </div>
                            </div>
                        )}
                    </div>

                    {answered && (
                        <div className="flex justify-end fade-in px-2 pb-10">
                            <button type="button" onClick={() => {
                                if (currentQ < CLASSIFY_PHRASES.length - 1) { setCurrentQ(q => q + 1); setAnswered(false); setSelected(null); setShowHint(false); window.scrollTo({ top: 0, behavior: 'smooth' }); }
                                else { setCompleted(true); window.scrollTo({ top: 0, behavior: 'smooth' }); }
                            }} className="bg-cyan-600 hover:bg-cyan-700 text-white text-xl md:text-2xl font-bold py-4 px-10 rounded-full border-b-4 border-cyan-800 active:border-b-0 shadow-md transition-all flex items-center gap-3 hover:-translate-x-1 active:translate-y-1 cursor-pointer">
                                <span>{currentQ < CLASSIFY_PHRASES.length - 1 ? 'العبارة التالية' : 'عرض نتيجة القسم'}</span>
                                <IconArrowLeft className="w-6 h-6" />
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // 7. قسم صواب وخطأ
        const TrueFalseSection = () => {
            const [score, setScore] = useState(0);
            const [currentQ, setCurrentQ] = useState(0);
            const [answered, setAnswered] = useState(false);
            const [selected, setSelected] = useState(null);
            const [completed, setCompleted] = useState(false);
            const [showHint, setShowHint] = useState(false);

            const reset = () => { setScore(0); setCurrentQ(0); setAnswered(false); setSelected(null); setCompleted(false); setShowHint(false); window.scrollTo({top: 0, behavior: 'smooth'}); };

            if (completed) return <SectionResult score={score} maxScore={TF_QUESTIONS.length} onReset={reset} sectionTitle="صواب أم خطأ" theme="rose" />;

            const q = TF_QUESTIONS[currentQ];
            const isCorrect = selected === q.answer;
            
            return (
                <div className="fade-in max-w-3xl mx-auto py-2 pb-12">
                    <div className="flex justify-between items-center mb-6 text-rose-600 font-bold px-2 text-lg md:text-xl">
                        <span>قسم الصواب والخطأ</span>
                        <span>السؤال {toArabicNum(currentQ + 1)} من {toArabicNum(TF_QUESTIONS.length)}</span>
                    </div>
                    <div className="w-full bg-rose-100 h-3 rounded-full mb-8 overflow-hidden shadow-inner">
                        <div className="bg-rose-500 h-full transition-all duration-500 ease-out" style={{width: `${((currentQ + 1) / TF_QUESTIONS.length) * 100}%`}}></div>
                    </div>

                    <div className="bg-white rounded-3xl p-6 md:p-10 shadow-sm border border-rose-200 mb-8 relative">
                        {/* زر التلميح مع النص */}
                        <div className="absolute top-4 left-4 md:top-6 md:left-6">
                            <button type="button" onClick={() => setShowHint(!showHint)} className="bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-700 px-4 py-2 rounded-full shadow-sm transition-all flex items-center gap-2 active:scale-95 group cursor-pointer" title="تلميح للحل">
                                <IconLightbulb className="w-5 h-5 md:w-6 md:h-6 group-hover:text-amber-500 transition-colors" />
                                <span className="font-bold text-sm md:text-base">تلميح</span>
                            </button>
                        </div>

                        <h2 className="text-2xl md:text-3xl font-semibold text-slate-900 mb-8 leading-loose text-center bg-rose-50 p-8 pt-16 rounded-2xl border border-rose-100">
                            {q.text}
                        </h2>

                        {showHint && (
                            <div className="bg-amber-50 text-amber-900 p-5 rounded-2xl mb-8 text-lg md:text-xl font-medium border border-amber-200 fade-in flex gap-3 items-start">
                                <span className="text-amber-500 font-bold text-2xl">💡</span>
                                <span className="leading-relaxed">{q.hint}</span>
                            </div>
                        )}

                        <div className="grid grid-cols-2 gap-4 md:gap-6">
                            <button
                                type="button"
                                disabled={answered}
                                onClick={() => { setSelected(true); setAnswered(true); if (q.answer === true) setScore(s => s + 1); setShowHint(false); }}
                                className={`py-6 rounded-2xl border-2 font-medium text-2xl transition-all outline-none ${
                                    !answered 
                                    ? "border-slate-200 hover:border-rose-400 hover:bg-rose-50 bg-white text-slate-800 shadow-sm cursor-pointer"
                                    : (q.answer === true 
                                        ? "border-emerald-500 bg-emerald-50 text-emerald-900 shadow-md relative z-10 font-bold" 
                                        : (selected === true ? "border-rose-500 bg-rose-50 text-rose-900 shadow-md relative z-10 font-bold" : "border-slate-100 bg-slate-50 text-slate-500 opacity-40")
                                      )
                                }`}
                            >صواب</button>

                            <button
                                type="button"
                                disabled={answered}
                                onClick={() => { setSelected(false); setAnswered(true); if (q.answer === false) setScore(s => s + 1); setShowHint(false); }}
                                className={`py-6 rounded-2xl border-2 font-medium text-2xl transition-all outline-none ${
                                    !answered 
                                    ? "border-slate-200 hover:border-rose-400 hover:bg-rose-50 bg-white text-slate-800 shadow-sm cursor-pointer"
                                    : (q.answer === false 
                                        ? "border-emerald-500 bg-emerald-50 text-emerald-900 shadow-md relative z-10 font-bold" 
                                        : (selected === false ? "border-rose-500 bg-rose-50 text-rose-900 shadow-md relative z-10 font-bold" : "border-slate-100 bg-slate-50 text-slate-500 opacity-40")
                                      )
                                }`}
                            >خطأ</button>
                        </div>

                        {/* التغذية الراجعة الفورية */}
                        {answered && (
                            <div className={`mt-8 p-6 border-2 rounded-2xl fade-in shadow-sm ${isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`}>
                                <div className="flex items-center gap-3 mb-4 border-b pb-4" style={{borderColor: isCorrect ? 'rgba(16, 185, 129, 0.2)' : 'rgba(244, 63, 94, 0.2)'}}>
                                    <div className={isCorrect ? "text-emerald-600" : "text-rose-600"}>
                                        {isCorrect ? <IconCheckCircle className="w-8 h-8" /> : <IconXCircle className="w-8 h-8" />}
                                    </div>
                                    <span className={`text-2xl font-bold ${isCorrect ? 'text-emerald-800' : 'text-rose-800'}`}>
                                        {isCorrect ? 'إجابة صحيحة' : 'إجابة خاطئة'}
                                    </span>
                                </div>
                                <div className="flex items-start gap-4 mt-2">
                                    <div className={isCorrect ? "text-emerald-600 mt-1" : "text-rose-600 mt-1"}><IconSparkles className="w-7 h-7" /></div>
                                    <span className={`text-xl md:text-2xl font-medium leading-loose ${isCorrect ? 'text-emerald-900' : 'text-rose-900'}`}>{q.explanation}</span>
                                </div>
                            </div>
                        )}
                    </div>

                    {answered && (
                        <div className="flex justify-end fade-in px-2 pb-10">
                            <button type="button" onClick={() => {
                                if (currentQ < TF_QUESTIONS.length - 1) { setCurrentQ(q => q + 1); setAnswered(false); setSelected(null); setShowHint(false); window.scrollTo({ top: 0, behavior: 'smooth' }); }
                                else { setCompleted(true); window.scrollTo({ top: 0, behavior: 'smooth' }); }
                            }} className="bg-rose-500 hover:bg-rose-600 text-white text-xl md:text-2xl font-bold py-4 px-10 rounded-full border-b-4 border-rose-700 active:border-b-0 shadow-md transition-all flex items-center gap-3 hover:-translate-x-1 active:translate-y-1 cursor-pointer">
                                <span>{currentQ < TF_QUESTIONS.length - 1 ? 'السؤال التالي' : 'عرض نتيجة القسم'}</span>
                                <IconArrowLeft className="w-6 h-6" />
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // ================= المكون الأساسي للتطبيق =================
        function App() {
            const [activeTab, setActiveTab] = useState('welcome');

            const changeTab = (tabId) => {
                setActiveTab(tabId);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                <div className="w-full flex flex-col min-h-screen">
                    <Header />
                    <NavigationBar activeTab={activeTab} changeTab={changeTab} />
                    
                    <div className="container mx-auto px-4 md:px-8 max-w-5xl flex-grow">
                        <div style={{ display: activeTab === 'welcome' ? 'block' : 'none' }}>
                            <WelcomeSection changeTab={changeTab} />
                        </div>
                        <div style={{ display: activeTab === 'quiz' ? 'block' : 'none' }}>
                            <QuizSection />
                        </div>
                        <div style={{ display: activeTab === 'classify' ? 'block' : 'none' }}>
                            <ClassifySection />
                        </div>
                        <div style={{ display: activeTab === 'tf' ? 'block' : 'none' }}>
                            <TrueFalseSection />
                        </div>
                    </div>

                    <footer className="mt-auto py-8 bg-white border-t border-gray-200 text-center shadow-inner">
                        <a href="https://www.youtube.com/egysalah" target="_blank" rel="noopener noreferrer" className="text-slate-600 hover:text-violet-700 font-bold text-lg md:text-xl transition-colors inline-block">
                            جميع الحقوق محفوظة لقناة العربية السهلة
                        </a>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
