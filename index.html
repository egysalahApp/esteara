            const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];

        const shuffleArray = (array) => {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;

            { text: "في الاستعارة التمثيلية نشبه كلمة مفردة بكلمة مفردة أخرى.", answer: false, explanation: "الاستعارة التمثيلية نشبه فيها (حالة كاملة) بـ (حالة كاملة).", hint: "التمثيلية تحتاج لمشهد أو صورة مركبة." },
            { text: "«رأيت بحرًا يتصدق على الفقراء» هي استعارة تصريحية.", answer: true, explanation: "لأنه صرح بالمشبه به (بحرًا) وحذف المشبه (الرجل الكريم).", hint: "كلمة (بحر) مذكورة صراحة مكان الرجل." },
            { text: "في الاستعارة المكنية يجب أن يرافقها دليل (قرينة) يمنع المعنى الحقيقي.", answer: true, explanation: "مثل الابتسام للفرصة، يمنع أن تكون الفرصة إنسانًا حقيقيًا.", hint: "لابد من خيال يمنع المعنى الحقيقي." }
        ];

        const SECTIONS = [
            { id: 'intro', label: 'قبل أن نبدأ', data: [], theme: 'amber' },
            { id: 'quiz', label: 'اختر الإجابة', data: QUIZ_QUESTIONS, theme: 'violet' },
            { id: 'classify', label: 'التصنيف', data: CLASSIFY_PHRASES, theme: 'cyan' },
            { id: 'tf', label: 'صواب وخطأ', data: TF_QUESTIONS, theme: 'rose' }
        ];

        // ================= المكونات الفرعية =================

        // 1. مكون الترويسة العليا (تختفي عند التمرير)
        const Header = () => (
            <div className="w-full text-center py-6 bg-transparent">
                <a href="https://www.youtube.com/egysalah" target="_blank" rel="noopener noreferrer" 
                   className="inline-flex items-center justify-center gap-2 text-2xl font-bold text-slate-900 mb-1">
                    <span>العربية السهلة</span>
                    <IconYoutube className="w-7 h-7" />
                </a>
                <h2 className="text-lg font-bold text-slate-500">محمود صلاح</h2>
            </div>
        );

        // 2. تبويب "قبل أن نبدأ" (الملخص)
        const IntroSection = ({ onNext }) => (
            <div className="max-w-3xl mx-auto space-y-6 fade-in">
                <div className="bg-white p-6 md:p-8 rounded-2xl border-2 border-amber-100 shadow-sm flex flex-col md:flex-row items-center md:items-start text-center md:text-right gap-6">
                    <div className="bg-amber-100 p-4 rounded-full shrink-0">
                        <IconHidden className="w-10 h-10 text-amber-600" />
                    </div>
                    <div>
                        <h3 className="text-2xl font-semibold text-slate-700 mb-3">١. الاستعارة المكنية</h3>
                        <p className="text-xl text-slate-600 leading-relaxed">
                            هي التي نَحْذِفُ فيها (المشبه به) ونأتي بصفة من صفاته تدل عليه.<br/>
                            <span className="text-amber-600 font-semibold">مثال:</span> طار الخبر في المدينة. (شبهنا الخبر بطائر، وحذفنا الطائر وأبقينا صفة الطيران).
                        </p>
                    </div>
                </div>

                <div className="bg-white p-6 md:p-8 rounded-2xl border-2 border-violet-100 shadow-sm flex flex-col md:flex-row items-center md:items-start text-center md:text-right gap-6">
                    <div className="bg-violet-100 p-4 rounded-full shrink-0">
                        <IconLoud className="w-10 h-10 text-violet-600" />
                    </div>
                    <div>
                        <h3 className="text-2xl font-semibold text-slate-700 mb-3">٢. الاستعارة التصريحية</h3>
                        <p className="text-xl text-slate-600 leading-relaxed">
                            هي التي نُصَرِّحُ فيها بلفظ (المشبه به) ونحذف (المشبه).<br/>
                            <span className="text-violet-600 font-semibold">مثال:</span> عبر أسودنا القناة. (شبهنا الجنود بالأسود، وصرّحنا بكلمة أسود).
                        </p>
                    </div>
                </div>

                <div className="bg-white p-6 md:p-8 rounded-2xl border-2 border-cyan-100 shadow-sm flex flex-col md:flex-row items-center md:items-start text-center md:text-right gap-6">
                    <div className="bg-cyan-100 p-4 rounded-full shrink-0">
                        <IconScene className="w-10 h-10 text-cyan-600" />
                    </div>
                    <div>
                        <h3 className="text-2xl font-semibold text-slate-700 mb-3">٣. الاستعارة التمثيلية</h3>
                        <p className="text-xl text-slate-600 leading-relaxed">
                            هي تشبيه حالة كاملة بحالة أخرى كاملة (تكثر في الأمثال).<br/>
                            <span className="text-cyan-600 font-semibold">مثال:</span> لمن يبذل جهدًا بلا فائدة: "أنت تنفخ في رماد".
                        </p>
                    </div>
                </div>

                <div className="flex justify-center mt-10 pt-4">
                    <button onClick={onNext} className="bg-emerald-600 text-white font-semibold text-xl py-4 px-12 rounded-full shadow-md flex items-center gap-3 active:scale-95 transition-transform">
                        هيا نبدأ التدريبات
                        <IconArrowLeft className="w-6 h-6" />
                    </button>
                </div>
            </div>
        );

        // 3. بطاقة السؤال الواحد مع المنطق الداخلي والتغذية الراجعة
        const QuestionCard = ({ question, index, type, theme, onAnswerSubmit, resetKey }) => {
            const [answered, setAnswered] = useState(false);
            const [selected, setSelected] = useState(null);
            const [showHint, setShowHint] = useState(false);
            const [options, setOptions] = useState([]);

            useEffect(() => {
                setAnswered(false);
                setSelected(null);
                setShowHint(false);
                
                let initialOptions = [];
                if (type === 'quiz') {
                    initialOptions = question.options.map((opt, idx) => ({ text: opt, isCorrect: idx === question.correct, originalIndex: idx }));
                } else if (type === 'classify') {
                    initialOptions = [
                        { text: "مكنية", val: "makneya", isCorrect: "makneya" === question.type },
                        { text: "تصريحية", val: "tasreheya", isCorrect: "tasreheya" === question.type },
                        { text: "تمثيلية", val: "tamtheleya", isCorrect: "tamtheleya" === question.type }
                    ];
                } else if (type === 'tf') {
                    initialOptions = [
                        { text: "صواب", val: true, isCorrect: true === question.answer },
                        { text: "خطأ", val: false, isCorrect: false === question.answer }
                    ];
                }
                
                // إيقاف الخلط العشوائي للاختيارات والاحتفاظ بالترتيب الأصلي
                setOptions(initialOptions);
            }, [question, type, resetKey]);

            const handleAnswer = (opt) => {
                if (answered) return;
                setSelected(opt);
                setAnswered(true);
                onAnswerSubmit(opt.isCorrect);
            };

            const isSelectedCorrect = selected && selected.isCorrect;

            return (
                <div className={`bg-white rounded-2xl p-6 md:p-10 shadow-sm border border-slate-200 mb-8 relative fade-in transition-all duration-300 ${answered ? (isSelectedCorrect ? 'ring-2 ring-emerald-400' : 'ring-2 ring-rose-400') : ''}`}>
                    
                    <div className="flex justify-between items-center mb-6">
                        <span className={`font-semibold text-lg md:text-xl text-${theme}-700 bg-${theme}-100 px-5 py-2 rounded-full`}>
                            السؤال {toArabicNum(index + 1)}
                        </span>
                        
                        <button onClick={() => setShowHint(!showHint)} 
                                className={`flex items-center gap-2 px-4 py-2 rounded-full text-lg md:text-xl font-semibold border transition-all active:scale-95 ${showHint ? 'bg-amber-100 border-amber-300 text-amber-800' : 'bg-white border-amber-200 text-amber-700 hover:bg-amber-50'}`}>
                            <IconLightbulb className="w-5 h-5 md:w-6 md:h-6 text-amber-500" />
                            تلميح
                        </button>
                    </div>

                    <h3 className="text-2xl md:text-3xl font-semibold text-slate-700 mb-8 leading-relaxed whitespace-pre-line text-center bg-slate-50 p-6 rounded-xl border border-slate-100">
                        {question.text}
                    </h3>

                    {showHint && (
                        <div className="bg-amber-50 text-amber-900 p-5 rounded-xl mb-6 text-lg md:text-xl font-medium border border-amber-200 fade-in flex gap-3 items-start">
                            <span className="text-amber-500 font-semibold text-xl md:text-2xl leading-none">💡</span>
                            <span className="leading-relaxed">{question.hint}</span>
                        </div>
                    )}

                    <div className={`grid gap-4 mx-auto w-full ${type === 'classify' ? 'max-w-3xl grid-cols-1 md:grid-cols-3' : 'max-w-2xl ' + (type === 'quiz' ? 'grid-cols-1' : 'grid-cols-1 md:grid-cols-2')}`}>
                        {options.map((opt, idx) => {
                            let btnClass = "";
                            
                            if (type === 'classify') {
                                // تصميم الصناديق (Boxes) مع تأثير ثلاثي الأبعاد الانضغاطي
                                btnClass = "relative overflow-hidden w-full p-6 md:p-8 rounded-2xl border-2 border-b-8 transition-all font-bold text-xl md:text-2xl flex flex-col justify-center items-center gap-3 ";
                                if (!answered) {
                                    btnClass += `border-slate-200 bg-slate-50 text-slate-700 hover:border-${theme}-300 hover:bg-${theme}-50 hover:text-${theme}-700 hover:-translate-y-1 active:scale-95 active:border-b-2 active:translate-y-1 cursor-pointer`;
                                } else {
                                    if (opt.isCorrect) btnClass += "bg-emerald-50 border-emerald-500 border-b-emerald-600 text-emerald-800";
                                    else if (selected === opt) btnClass += "bg-rose-50 border-rose-500 border-b-rose-600 text-rose-800";
                                    else btnClass += "bg-slate-50 border-slate-100 border-b-slate-200 text-slate-400 opacity-60";
                                    btnClass += " cursor-default";
                                }
                            } else {
                                // تصميم الأزرار العادية للاختيار والصواب والخطأ
                                btnClass = "w-full p-5 rounded-xl border-2 transition-all font-semibold text-xl flex justify-center items-center gap-3 ";
                                if (!answered) {
                                    btnClass += `border-slate-200 bg-white text-slate-600 active:scale-95 hover:bg-slate-50 cursor-pointer`;
                                } else {
                                    if (opt.isCorrect) btnClass += "bg-emerald-50 border-emerald-500 text-emerald-800";
                                    else if (selected === opt) btnClass += "bg-rose-50 border-rose-500 text-rose-800";
                                    else btnClass += "bg-slate-50 border-slate-100 text-slate-400 opacity-60";
                                    btnClass += " cursor-default";
                                }
                            }

                            return (
                                <button key={idx} disabled={answered} onClick={() => handleAnswer(opt)} className={btnClass}>
                                    
                                    {/* أيقونة الصندوق تظهر فقط في قسم التصنيف */}
                                    {type === 'classify' && (
                                        <IconTray className={`w-10 h-10 md:w-14 md:h-14 mb-2 transition-colors ${answered ? (opt.isCorrect ? 'text-emerald-500' : (selected === opt ? 'text-rose-500' : 'text-slate-300')) : `text-${theme}-400`}`} />
                                    )}
                                    
                                    <span className="relative z-10">{opt.text}</span>
                                    
                                    {/* أيقونات الأزرار العادية */}
                                    {answered && opt.isCorrect && type !== 'classify' && <IconCheckCircle className="w-6 h-6 md:w-7 md:h-7 text-emerald-600 shrink-0" />}
                                    {answered && selected === opt && !opt.isCorrect && type !== 'classify' && <IconXCircle className="w-6 h-6 md:w-7 md:h-7 text-rose-500 shrink-0" />}
                                    
                                    {/* أيقونات الصناديق (توضع في الزاوية العلوية بشكل أنيق) */}
                                    {type === 'classify' && answered && opt.isCorrect && <IconCheckCircle className="w-6 h-6 md:w-8 md:h-8 text-emerald-600 absolute top-3 right-3 md:top-4 md:right-4 opacity-80" />}
                                    {type === 'classify' && answered && selected === opt && !opt.isCorrect && <IconXCircle className="w-6 h-6 md:w-8 md:h-8 text-rose-500 absolute top-3 right-3 md:top-4 md:right-4 opacity-80" />}
                                    
                                </button>
                            );
                        })}
                    </div>

                    {answered && (
                        <div className={`mt-8 p-5 rounded-xl border fade-in ${isSelectedCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`}>
                            <div className={`flex items-center gap-2 mb-3 font-bold text-xl md:text-2xl ${isSelectedCorrect ? 'text-emerald-700' : 'text-rose-700'}`}>
                                {isSelectedCorrect ? <IconCheckCircle className="w-7 h-7 md:w-8 md:h-8" /> : <IconXCircle className="w-7 h-7 md:w-8 md:h-8" />}
                                <span>{isSelectedCorrect ? 'إجابة صحيحة' : 'إجابة خاطئة'}</span>
                            </div>
                            <div className="flex items-start gap-3 mt-3">
                                <IconSparkles className={`w-5 h-5 md:w-6 md:h-6 mt-1 shrink-0 ${isSelectedCorrect ? "text-emerald-500" : "text-rose-500"}`} />
                                <span className={`text-lg md:text-xl font-semibold leading-relaxed ${isSelectedCorrect ? 'text-emerald-800' : 'text-rose-800'}`}>
                                    {question.explanation}
                                </span>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // 4. مكون التقييم النهائي الشامل
        const FinalEvaluation = ({ progress, onRestart }) => {
            const evalRef = useRef(null);

            // إضافة تأثير التمرير التلقائي الهادئ فور ظهور النتيجة النهائية
            useEffect(() => {
                if (evalRef.current) {
                    setTimeout(() => {
                        evalRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 400); // تأخير بسيط جداً للسماح بانتهاء حركة الظهور (Fade-in)
                }
            }, []);

            const totalScore = Object.values(progress).reduce((acc, p) => acc + p.score, 0);
            const totalQuestions = Object.values(progress).reduce((acc, p) => acc + p.total, 0);
            
            if (totalQuestions === 0) return null;
            
            const percentage = Math.round((totalScore / totalQuestions) * 100);

            let message = "";
            let color = "";
            
            if (percentage < 60) { message = "تحتاج إلى مزيد من التدريب، لا تيأس وحاول مرة أخرى!"; color = "text-rose-600"; }
            else if (percentage < 85) { message = "أداء رائع! مستواك جيد جدًا في البلاغة."; color = "text-violet-600"; }
            else { message = "أداء استثنائي! أنت بطل حقيقي وخبير في الاستعارة."; color = "text-emerald-600"; }

            return (
                <div ref={evalRef} className="mt-12 bg-white p-8 md:p-12 rounded-3xl shadow-lg border-2 border-amber-200 text-center fade-in">
                    <IconMedal className="w-24 h-24 md:w-32 md:h-32 mx-auto text-amber-400 mb-6 drop-shadow-md" />
                    <h2 className="text-3xl md:text-4xl font-bold text-slate-700 mb-4">التقييم النهائي</h2>
                    <div className="text-6xl md:text-8xl font-bold mb-6 text-slate-700" style={{ direction: 'ltr' }}>
                        <span className={color}>{toArabicNum(totalScore)}</span>
                        <span className="text-slate-300 text-5xl font-medium">/</span>
                        <span className="text-slate-500">{toArabicNum(totalQuestions)}</span>
                    </div>
                    <div className="inline-block bg-amber-100 text-amber-800 px-6 py-2 rounded-full font-semibold text-xl md:text-2xl mb-6">
                        النسبة المئوية: {toArabicNum(percentage)}%
                    </div>
                    <p className={`text-xl md:text-2xl font-semibold leading-relaxed ${color} mb-10`}>{message}</p>
                    
                    <button onClick={onRestart} className="px-8 md:px-10 py-3 md:py-4 rounded-full font-semibold text-xl md:text-2xl text-white bg-slate-700 hover:bg-slate-800 shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-3 mx-auto">
                        <IconRefresh className="w-6 h-6 md:w-7 md:h-7" />
                        ابدأ من جديد
                    </button>
                </div>
            );
        };

        // مكون حاوية القسم (للحفاظ على الإجابات عند التنقل)
        const SectionContainer = ({ section, isActive, resetKey, progress, onAnswerSubmit, onReset, onNext, isLast }) => {
            // خلط الأسئلة نفسها عشوائيًا عند بدء القسم أو إعادة المحاولة
            const shuffledQuestions = React.useMemo(() => {
                return shuffleArray(section.data);
            }, [section.data, resetKey]);

            const isCurrentSectionComplete = progress.total > 0 && progress.answered === progress.total;

            return (
                <div className={isActive ? 'block' : 'hidden'}>
                    {shuffledQuestions.map((q, idx) => (
                        <QuestionCard
                            key={`${section.id}-${idx}-${resetKey}`}
                            question={q}
                            index={idx}
                            type={section.id}
                            theme={section.theme}
                            resetKey={resetKey}
                            onAnswerSubmit={onAnswerSubmit}
                        />
                    ))}

                    {/* ملخص القسم (يظهر عند الانتهاء من أسئلة القسم فقط) */}
                    {isCurrentSectionComplete && (
                        <div className={`mt-12 p-8 md:p-10 bg-white border-2 border-${section.theme}-200 rounded-2xl shadow-sm text-center fade-in max-w-2xl mx-auto w-full`}>
                            <h3 className="text-2xl md:text-3xl font-semibold text-slate-700 mb-6">نتيجتك في قسم ({section.label})</h3>
                            <div className={`text-5xl font-bold text-${section.theme}-600`} style={{direction: 'ltr'}}>
                                {toArabicNum(progress.score)} <span className="text-4xl text-slate-300 font-medium">/</span> {toArabicNum(progress.total)}
                            </div>
                        </div>
                    )}

                    {/* أزرار النهاية (دائمة الظهور) */}
                    <div className="mt-8 flex flex-col md:flex-row justify-center items-center gap-4 max-w-2xl mx-auto w-full">
                        <button onClick={onReset}
                                className="w-full md:w-auto px-8 py-3 md:py-4 rounded-full font-semibold text-lg md:text-xl text-slate-600 bg-slate-100 hover:bg-slate-200 active:scale-95 transition-transform flex items-center justify-center gap-3">
                            <IconRefresh className="w-5 h-5 md:w-6 md:h-6" />
                            إعادة المحاولة
                        </button>

                        {!isLast && (
                            <button onClick={onNext}
                                    className={`w-full md:w-auto px-8 md:px-10 py-3 md:py-4 rounded-full font-semibold text-lg md:text-xl text-white shadow-md transition-transform flex items-center justify-center gap-3 active:scale-95 bg-${section.theme}-600 hover:bg-${section.theme}-700`}>
                                القسم التالي
                                <IconArrowLeft className="w-5 h-5 md:w-6 md:h-6" />
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        // ================= التطبيق الرئيسي =================
        function App() {
            const [activeTab, setActiveTab] = useState(SECTIONS[0].id);
            const [resetKeys, setResetKeys] = useState({ quiz: 0, classify: 0, tf: 0 });
            
            // حالة التقدم لكل قسم (باستثناء intro الذي ليس به أسئلة)
            const [progress, setProgress] = useState({
                intro: { answered: 0, total: 0, score: 0 },
                quiz: { answered: 0, total: SECTIONS[1].data.length, score: 0 },
                classify: { answered: 0, total: SECTIONS[2].data.length, score: 0 },
                tf: { answered: 0, total: SECTIONS[3].data.length, score: 0 }
            });

            const contentRef = useRef(null);

            const scrollToContent = useCallback(() => {
                if (contentRef.current) {
                    contentRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }, []);

            const handleTabChange = (tabId) => {
                setActiveTab(tabId);
                scrollToContent();
            };

            const handleAnswerSubmit = (sectionId, isCorrect) => {
                setProgress(prev => {
                    const current = prev[sectionId];
                    return {
                        ...prev,
                        [sectionId]: {
                            ...current,
                            answered: current.answered + 1,
                            score: isCorrect ? current.score + 1 : current.score
                        }
                    };
                });
            };

            const handleResetSection = (sectionId) => {
                setResetKeys(prev => ({ ...prev, [sectionId]: prev[sectionId] + 1 }));
                setProgress(prev => ({
                    ...prev,
                    [sectionId]: { ...prev[sectionId], answered: 0, score: 0 }
                }));
                scrollToContent();
            };

            const handleGlobalRestart = () => {
                // تصفير جميع مفاتيح إعادة التهيئة لكل قسم
                setResetKeys(prev => ({
                    quiz: prev.quiz + 1,
                    classify: prev.classify + 1,
                    tf: prev.tf + 1
                }));
                // تصفير درجات جميع الأقسام بالكامل
                setProgress({
                    intro: { answered: 0, total: 0, score: 0 },
                    quiz: { answered: 0, total: SECTIONS[1].data.length, score: 0 },
                    classify: { answered: 0, total: SECTIONS[2].data.length, score: 0 },
                    tf: { answered: 0, total: SECTIONS[3].data.length, score: 0 }
                });
                // العودة للتبويب الأول (المقدمة) مع التمرير السلس
                handleTabChange(SECTIONS[0].id);
            };

            const handleNextSection = () => {
                const currentIndex = SECTIONS.findIndex(s => s.id === activeTab);
                if (currentIndex < SECTIONS.length - 1) {
                    handleTabChange(SECTIONS[currentIndex + 1].id);
                }
            };

            const currentSection = SECTIONS.find(s => s.id === activeTab);
            const currentProgress = progress[activeTab];
            const progressPercent = currentProgress.total > 0 ? (currentProgress.answered / currentProgress.total) * 100 : 0;
            
            // التحقق من أن جميع الأقسام (التي تحتوي على أسئلة) قد اكتملت
            const isAllComplete = Object.values(progress)
                                        .filter(p => p.total > 0)
                                        .every(p => p.answered === p.total);

            return (
                <div className="w-full flex flex-col min-h-screen">
                    <Header />
                    
                    {/* شريط التبويبات الثابت والرفيع */}
                    <div className="sticky top-0 z-50 bg-[#f8fafc]/95 backdrop-blur-md shadow-sm border-b border-slate-200">
                        {/* التوسيط الآمن لمنع قص التبويبات عند التكبير مع التمرير الأفقي */}
                        <div className="mx-auto w-max max-w-full overflow-x-auto px-4 no-scrollbar">
                            <div className="flex flex-nowrap py-1 gap-3">
                                {SECTIONS.map(section => {
                                    const isActive = activeTab === section.id;
                                    const secProgress = progress[section.id];
                                    const isDone = secProgress.total > 0 && secProgress.answered === secProgress.total;
                                    
                                    let activeClass = "";
                                    if (isActive) {
                                        activeClass = section.theme === 'violet' ? "bg-violet-600 text-white border-violet-600 shadow-md" :
                                                      section.theme === 'cyan'   ? "bg-cyan-600 text-white border-cyan-600 shadow-md" :
                                                      section.theme === 'rose'   ? "bg-rose-600 text-white border-rose-600 shadow-md" :
                                                                                   "bg-amber-500 text-white border-amber-500 shadow-md";
                                    } else {
                                        // بدون تأثيرات Hover
                                        activeClass = "bg-white text-slate-600 border-slate-200";
                                    }

                                    return (
                                        <button key={section.id} type="button" onClick={() => handleTabChange(section.id)} 
                                                className={`px-6 py-1 rounded-full font-semibold text-lg md:text-xl border-2 transition-all flex items-center gap-2 ${activeClass}`}>
                                            {section.label}
                                            {isDone && !isActive && <IconCheckCircle className="w-4 h-4 md:w-5 md:h-5 text-emerald-500" />}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                        {/* شريط التقدم النحيف (2px) المدمج تحت التبويبات */}
                        <div className="w-full h-[2px] bg-slate-200">
                            <div className={`h-full transition-all duration-500 ease-out bg-${currentSection.theme}-500`} 
                                 style={{ width: `${progressPercent}%` }}></div>
                        </div>
                    </div>
                    
                    {/* محتوى القسم - مضاف له scroll-mt-12 لمنع الاختفاء خلف التبويبات */}
                    <main ref={contentRef} className="container mx-auto px-4 py-8 max-w-4xl flex-grow scroll-mt-12">
                        
                        <h1 className="text-center text-3xl md:text-4xl font-semibold text-slate-700 mb-10">تدريبات الاستعارة</h1>

                        <div className={activeTab === 'intro' ? 'block' : 'hidden'}>
                            <IntroSection onNext={handleNextSection} />
                        </div>

                        {SECTIONS.filter(s => s.id !== 'intro').map(section => (
                            <SectionContainer 
                                key={section.id}
                                section={section}
                                isActive={activeTab === section.id}
                                resetKey={resetKeys[section.id]}
                                progress={progress[section.id]}
                                onAnswerSubmit={(isCorrect) => handleAnswerSubmit(section.id, isCorrect)}
                                onReset={() => handleResetSection(section.id)}
                                onNext={handleNextSection}
                                isLast={section.id === SECTIONS[SECTIONS.length - 1].id}
                            />
                        ))}

                        {/* إظهار التقييم النهائي فقط إذا أتم الطالب جميع الأقسام */}
                        {isAllComplete && activeTab !== 'intro' && <FinalEvaluation progress={progress} onRestart={handleGlobalRestart} />}
                        
                    </main>

                    {/* التذييل */}
                    <footer className="mt-auto py-8 bg-white border-t border-slate-200 text-center">
                        <a href="https://www.youtube.com/egysalah" target="_blank" rel="noopener noreferrer" 
                           className="text-slate-400 text-sm font-medium block w-full">
                            جميع الحقوق محفوظة لقناة العربية السهلة
                        </a>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
