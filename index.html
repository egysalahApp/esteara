                { text: "في الاستعارة التمثيلية نشبه كلمة مفردة بكلمة مفردة أخرى.", type: "tf", correctAnswer: false, explanation: "الاستعارة التمثيلية نشبه فيها (حالة كاملة) بـ (حالة كاملة).", hint: "التمثيلية تحتاج لمشهد أو صورة مركبة." },
                { text: "«رأيت بحرًا يتصدق على الفقراء» هي استعارة تصريحية.", type: "tf", correctAnswer: true, explanation: "لأنه صرح بالمشبه به (بحرًا) وحذف المشبه (الرجل الكريم).", hint: "كلمة (بحر) مذكورة صراحة مكان الرجل." },
                { text: "في الاستعارة المكنية يجب أن يرافقها دليل (قرينة) يمنع المعنى الحقيقي.", type: "tf", correctAnswer: true, explanation: "مثل الابتسام للفرصة، يمنع أن تكون الفرصة إنساناً حقيقياً.", hint: "لابد من خيال يمنع المعنى الحقيقي." }
            ]
        };

        const SECTIONS = [
            { id: 'quiz', label: 'اختر الإجابة', theme: 'indigo' },
            { id: 'classify', label: 'التصنيف', theme: 'teal' },
            { id: 'tf', label: 'صواب وخطأ', theme: 'rose' }
        ];

        // ================= مكون الترويسة العلوية =================
        const Header = () => (
            <header className="w-full text-center py-6 bg-transparent flex flex-col items-center justify-center">
                <a href="https://www.youtube.com/egysalah" target="_blank" rel="noopener noreferrer" 
                   className="inline-flex items-center gap-2 text-2xl font-bold text-slate-800 hover:text-red-600 transition-colors duration-300 bg-transparent">
                    <span>العربية السهلة</span>
                    <IconYoutube className="w-7 h-7 text-red-600" />
                </a>
                <span className="text-lg font-bold text-slate-500 mt-1">محمود صلاح</span>
            </header>
        );

        // ================= بطاقة السؤال الواحد =================
        const QuestionCard = ({ data, index, theme, onAnswer, resetKey }) => {
            const [shuffledOptions, setShuffledOptions] = useState([]);
            const [answered, setAnswered] = useState(false);
            const [selectedIndex, setSelectedIndex] = useState(null);
            const [showHint, setShowHint] = useState(false);
            const [isCorrectState, setIsCorrectState] = useState(null);

            // ترتيب عشوائي للخيارات عند بدء أو إعادة القسم
            useEffect(() => {
                let opts = [];
                if (data.type === 'quiz') {
                    opts = data.options.map((text, i) => ({ text, isCorrect: i === data.correctIndex }));
                } else if (data.type === 'classify') {
                    opts = [
                        { text: 'استعارة مكنية', isCorrect: data.correctType === 'makneya' },
                        { text: 'استعارة تصريحية', isCorrect: data.correctType === 'tasreheya' },
                        { text: 'استعارة تمثيلية', isCorrect: data.correctType === 'tamtheleya' }
                    ];
                } else if (data.type === 'tf') {
                    opts = [
                        { text: 'صواب', isCorrect: data.correctAnswer === true },
                        { text: 'خطأ', isCorrect: data.correctAnswer === false }
                    ];
                }
                setShuffledOptions(shuffleArray(opts));
                setAnswered(false);
                setSelectedIndex(null);
                setShowHint(false);
                setIsCorrectState(null);
            }, [data, resetKey]);

            const handleSelect = (idx, isCorrect) => {
                if (answered) return;
                setAnswered(true);
                setSelectedIndex(idx);
                setIsCorrectState(isCorrect);
                onAnswer(isCorrect);
            };

            return (
                <div className={`bg-white rounded-2xl p-6 shadow-sm border border-slate-200 mb-6 fade-in hover:shadow-md transition-shadow duration-300`}>
                    <div className="flex justify-between items-center mb-4">
                        <span className={`font-bold text-sm text-${theme}-700 bg-${theme}-50 px-3 py-1 rounded-md`}>السؤال {toArabicNum(index + 1)}</span>
                        <button 
                            onClick={() => setShowHint(!showHint)} 
                            className="bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-700 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1.5 active:scale-95 group" 
                            title="تلميح"
                        >
                            <IconLightbulb className="w-4 h-4 text-amber-500 group-hover:text-amber-600" />
                            <span className="font-semibold text-sm">تلميح</span>
                        </button>
                    </div>

                    <h3 className="text-xl md:text-2xl font-bold text-slate-800 mb-6 leading-relaxed whitespace-pre-line">
                        {data.text}
                    </h3>

                    {showHint && (
                        <div className="bg-amber-50/80 text-amber-900 p-4 rounded-xl mb-6 text-base font-medium border border-amber-100 fade-in flex gap-3 items-start">
                            <span className="text-amber-500 text-lg leading-none mt-0.5">💡</span>
                            <span className="leading-relaxed">{data.hint}</span>
                        </div>
                    )}

                    <div className={data.type === 'tf' ? 'grid grid-cols-2 gap-3' : 'space-y-3'}>
                        {shuffledOptions.map((opt, idx) => {
                            let btnClass = "w-full text-right p-4 rounded-xl border-2 transition-all font-semibold text-lg flex justify-between items-center outline-none ";
                            if (!answered) {
                                btnClass += `border-slate-100 hover:border-${theme}-300 hover:bg-${theme}-50/50 text-slate-700 bg-white cursor-pointer`;
                            } else {
                                if (opt.isCorrect) btnClass += "bg-emerald-50 border-emerald-400 text-emerald-800";
                                else if (idx === selectedIndex) btnClass += "bg-rose-50 border-rose-400 text-rose-800";
                                else btnClass += "bg-slate-50 border-slate-100 text-slate-400 opacity-60";
                            }

                            return (
                                <button key={idx} disabled={answered} onClick={() => handleSelect(idx, opt.isCorrect)} className={btnClass}>
                                    <span className={data.type === 'tf' ? 'text-center w-full block' : ''}>{opt.text}</span>
                                    {answered && opt.isCorrect && <IconCheck className="w-6 h-6 text-emerald-600 flex-shrink-0" />}
                                    {answered && idx === selectedIndex && !opt.isCorrect && <IconX className="w-6 h-6 text-rose-600 flex-shrink-0" />}
                                </button>
                            );
                        })}
                    </div>

                    {answered && (
                        <div className={`mt-5 p-4 rounded-xl fade-in border ${isCorrectState ? 'bg-emerald-50/50 border-emerald-100' : 'bg-rose-50/50 border-rose-100'}`}>
                            <div className={`text-lg font-bold flex items-center gap-2 mb-2 ${isCorrectState ? 'text-emerald-700' : 'text-rose-700'}`}>
                                {isCorrectState ? <IconCheck className="w-5 h-5" /> : <IconX className="w-5 h-5" />}
                                {isCorrectState ? 'إجابة صحيحة' : 'إجابة خاطئة'}
                            </div>
                            <p className="text-slate-700 font-medium leading-relaxed">{data.explanation}</p>
                        </div>
                    )}
                </div>
            );
        };

        // ================= مكون القسم (يحتوي على مجموعة أسئلة) =================
        const SectionContent = ({ sectionId, theme, questions, onSectionComplete, onNextSection, isLastSection }) => {
            const [resetKey, setResetKey] = useState(0);
            const [score, setScore] = useState(0);
            const [answeredCount, setAnsweredCount] = useState(0);

            // تحديث التقدم العام للشريط العلوي
            useEffect(() => {
                window.dispatchEvent(new CustomEvent('updateProgress', { 
                    detail: { answered: answeredCount, total: questions.length }
                }));
            }, [answeredCount, questions.length]);

            const handleAnswer = (isCorrect) => {
                setAnsweredCount(prev => prev + 1);
                if (isCorrect) setScore(prev => prev + 1);
            };

            const isComplete = answeredCount === questions.length;

            useEffect(() => {
                if (isComplete) {
                    onSectionComplete(sectionId, score, questions.length);
                }
            }, [isComplete, score, sectionId, questions.length, onSectionComplete]);

            const handleReset = () => {
                setResetKey(prev => prev + 1);
                setScore(0);
                setAnsweredCount(0);
                const el = document.getElementById('main-content');
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            };

            const percentage = Math.round((score / questions.length) * 100);
            let resultMessage = "";
            let colorClass = "";

            if (percentage < 50) {
                resultMessage = "لا بأس، التدريب المستمر يجعلك أفضل! حاول مرة أخرى.";
                colorClass = "text-rose-600";
            } else if (percentage < 85) {
                resultMessage = "جيد؛ أنت تفهم البلاغة بشكل جميل.";
                colorClass = `text-${theme}-600`;
            } else {
                resultMessage = "أداء مبهر! أنت خبير حقيقي في البلاغة.";
                colorClass = "text-emerald-600";
            }

            return (
                <div className="fade-in max-w-3xl mx-auto w-full">
                    {questions.map((q, idx) => (
                        <QuestionCard key={`${resetKey}-${idx}`} data={q} index={idx} theme={theme} onAnswer={handleAnswer} resetKey={resetKey} />
                    ))}

                    {isComplete && (
                        <div className={`mt-8 p-8 text-center bg-white rounded-2xl shadow-sm border-2 border-${theme}-100 fade-in`}>
                            <IconTrophy className={`w-20 h-20 mx-auto mb-4 ${colorClass} opacity-90`} />
                            <h3 className="text-2xl font-bold mb-2 text-slate-800">نتيجتك في هذا القسم</h3>
                            <div className={`text-5xl font-black mb-4 ${colorClass}`} style={{ direction: 'ltr' }}>
                                {toArabicNum(score)} <span className="text-3xl text-slate-300 font-medium">/</span> {toArabicNum(questions.length)}
                            </div>
                            <p className={`text-lg font-bold ${colorClass}`}>{resultMessage}</p>
                        </div>
                    )}

                    <div className="flex flex-col sm:flex-row justify-center gap-4 mt-8 pb-4 border-t border-slate-100 pt-8">
                        <button onClick={handleReset} className="flex-1 max-w-xs mx-auto sm:mx-0 flex items-center justify-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 px-6 rounded-xl transition-colors active:scale-95 outline-none shadow-sm">
                            <IconRefresh className="w-5 h-5" />
                            إعادة المحاولة
                        </button>
                        
                        {!isLastSection && (
                            <button onClick={onNextSection} className={`flex-1 max-w-xs mx-auto sm:mx-0 flex items-center justify-center gap-2 bg-${theme}-600 hover:bg-${theme}-700 text-white font-bold py-3 px-6 rounded-xl transition-colors active:scale-95 outline-none shadow-md`}>
                                القسم التالي
                                <IconArrowLeft className="w-5 h-5" />
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        // ================= التطبيق الرئيسي =================
        const App = () => {
            const [activeTab, setActiveTab] = useState(SECTIONS[0].id);
            const [scores, setScores] = useState({ quiz: null, classify: null, tf: null });
            const [progressPercent, setProgressPercent] = useState(0);

            useEffect(() => {
                const handleUpdateProgress = (e) => {
                    const { answered, total } = e.detail;
                    setProgressPercent((answered / total) * 100);
                };
                window.addEventListener('updateProgress', handleUpdateProgress);
                return () => window.removeEventListener('updateProgress', handleUpdateProgress);
            }, []);

            const handleTabChange = (tabId) => {
                setActiveTab(tabId);
                setProgressPercent(0); // تصفير الشريط لحين تحميل المكون
                // استخدام setTimeout لضمان اكتمال تحميل المكون الجديد قبل التمرير
                setTimeout(() => {
                    const el = document.getElementById('main-content');
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 10);
            };

            const handleSectionComplete = (sectionId, score, total) => {
                setScores(prev => ({ ...prev, [sectionId]: { score, total } }));
            };

            const handleNextSection = () => {
                const currentIndex = SECTIONS.findIndex(s => s.id === activeTab);
                if (currentIndex < SECTIONS.length - 1) {
                    handleTabChange(SECTIONS[currentIndex + 1].id);
                }
            };

            const isAllCompleted = Object.values(scores).every(s => s !== null);

            let totalScore = 0;
            let totalQuestions = 0;
            let overallPercentage = 0;
            let finalMessage = "";
            let finalColorClass = "";

            if (isAllCompleted) {
                Object.values(scores).forEach(s => {
                    totalScore += s.score;
                    totalQuestions += s.total;
                });
                overallPercentage = Math.round((totalScore / totalQuestions) * 100);

                if (overallPercentage < 50) {
                    finalMessage = "لا بأس! البدايات دائمًا تتطلب جهدًا. راجع القاعدة وحاول مرة أخرى، أنت قادر على التحسن!";
                    finalColorClass = "text-rose-600";
                } else if (overallPercentage < 85) {
                    finalMessage = "أداء جيد جدًا! لديك فهم ممتاز للاستعارة، بقليل من التركيز ستصل إلى العلامة الكاملة.";
                    finalColorClass = "text-indigo-600";
                } else {
                    finalMessage = "عمل مبهر! أنت خبير حقيقي في البلاغة وتحديدًا في الاستعارة. استمر في هذا التميز!";
                    finalColorClass = "text-emerald-600";
                }
            }

            return (
                <div className="flex flex-col min-h-screen">
                    {/* ترويسة الصفحة (تختفي عند التمرير بشكل طبيعي) */}
                    <Header />

                    {/* شريط التبويبات والتقدم (ثابت أعلى الشاشة) */}
                    <div className="sticky top-0 z-50 bg-white/95 backdrop-blur-sm shadow-sm relative">
                        <div className="container mx-auto px-2">
                            {/* استخدام الخصائص لضمان شريط أفقي واحد وتمرير ناعم في الهواتف */}
                            <nav className="flex overflow-x-auto whitespace-nowrap flex-nowrap no-scrollbar py-1 justify-center gap-2">
                                {SECTIONS.map(section => {
                                    const isActive = activeTab === section.id;
                                    const baseClass = "px-4 py-1.5 rounded-lg font-bold text-sm md:text-base transition-all outline-none cursor-pointer flex-shrink-0 border-2 ";
                                    const activeClass = isActive 
                                        ? `bg-${section.theme}-600 text-white border-${section.theme}-600 shadow-sm` 
                                        : `bg-white text-slate-600 border-slate-100 hover:border-${section.theme}-200 hover:text-${section.theme}-700`;
                                    
                                    return (
                                        <button key={section.id} onClick={() => handleTabChange(section.id)} className={baseClass + activeClass}>
                                            {section.label}
                                        </button>
                                    );
                                })}
                            </nav>
                        </div>
                        {/* شريط التقدم النحيف */}
                        <div className="w-full h-[2px] bg-slate-100 absolute bottom-0 left-0">
                            <div 
                                className="h-full bg-slate-800 transition-all duration-300 ease-out" 
                                style={{ width: `${progressPercent}%`, right: 0, position: 'absolute' }}
                            ></div>
                        </div>
                    </div>

                    {/* المحتوى الرئيسي للمتطابق مع التبويب */}
                    <main id="main-content" className="flex-grow container mx-auto px-4 py-8 scroll-offset flex flex-col items-center">
                        
                        {/* رسالة ترحيبية بسيطة وعنوان يظهران في القسم الأول فقط */}
                        {activeTab === 'quiz' && (
                            <div className="max-w-3xl w-full text-center mb-8 fade-in">
                                <h1 className="text-3xl md:text-4xl font-extrabold text-slate-800 mb-3">أسرار البلاغة: الاستعارة</h1>
                                <p className="text-lg text-slate-600 font-medium">
                                    مرحبًا بك يا بطل اللغة العربية! اختر أحد التدريبات للبدء في اختبار معلوماتك حول الاستعارة (المكنية، التصريحية، والتمثيلية).
                                </p>
                            </div>
                        )}

                        <div className="w-full">
                            {activeTab === 'quiz' && <SectionContent sectionId="quiz" theme={SECTIONS[0].theme} questions={DATA.quiz} onSectionComplete={handleSectionComplete} onNextSection={handleNextSection} isLastSection={false} />}
                            {activeTab === 'classify' && <SectionContent sectionId="classify" theme={SECTIONS[1].theme} questions={DATA.classify} onSectionComplete={handleSectionComplete} onNextSection={handleNextSection} isLastSection={false} />}
                            {activeTab === 'tf' && <SectionContent sectionId="tf" theme={SECTIONS[2].theme} questions={DATA.tf} onSectionComplete={handleSectionComplete} onNextSection={handleNextSection} isLastSection={true} />}
                        </div>

                        {/* التقييم النهائي الشامل يظهر عند إنهاء كافة التدريبات */}
                        {isAllCompleted && (
                            <div className="w-full max-w-3xl mt-12 mb-8 fade-in">
                                <div className="bg-gradient-to-br from-slate-50 to-slate-100 p-8 md:p-12 rounded-3xl border border-slate-200 text-center shadow-md relative overflow-hidden">
                                    <IconTrophy className={`w-24 h-24 mx-auto mb-6 ${finalColorClass} opacity-90 drop-shadow-md`} />
                                    <h2 className="text-3xl md:text-4xl font-extrabold text-slate-800 mb-8">التقييم الشامل</h2>
                                    
                                    <div className="flex flex-col items-center justify-center mb-10">
                                        <span className="text-lg font-bold text-slate-500 mb-3">الدرجة الإجمالية</span>
                                        <div className={`text-6xl md:text-7xl font-black ${finalColorClass}`} style={{ direction: 'ltr' }}>
                                            {toArabicNum(totalScore)} <span className="text-4xl text-slate-300 font-medium">/</span> {toArabicNum(totalQuestions)}
                                        </div>
                                        <div className={`mt-4 text-2xl font-bold bg-white px-8 py-2 rounded-full shadow-sm border border-slate-100 ${finalColorClass}`}>
                                            {toArabicNum(overallPercentage)}%
                                        </div>
                                    </div>

                                    <div className="flex flex-wrap justify-center gap-4 mb-10">
                                        {SECTIONS.map(s => (
                                            <div key={s.id} className="bg-white px-5 py-4 rounded-xl shadow-sm border border-slate-100 min-w-[130px]">
                                                <div className="text-sm font-bold text-slate-500 mb-2">{s.label}</div>
                                                <div className={`text-2xl font-black text-${s.theme}-600`} style={{ direction: 'ltr' }}>
                                                    {toArabicNum(scores[s.id].score)} / {toArabicNum(scores[s.id].total)}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    
                                    <p className={`text-xl md:text-2xl font-bold leading-relaxed px-4 ${finalColorClass}`}>
                                        {finalMessage}
                                    </p>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* التذييل */}
                    <footer className="py-6 bg-white border-t border-slate-200 text-center mt-auto">
                        <a href="https://www.youtube.com/egysalah" target="_blank" rel="noopener noreferrer" className="text-slate-500 hover:text-red-600 font-bold text-sm md:text-base transition-colors duration-300">
                            جميع الحقوق محفوظة لقناة العربية السهلة
                        </a>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
