<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تدريبات الاستعارة | العربية السهلة</title>
    
    <!-- تضمين خط نوتو نسخ العربي من جوجل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- مكتبات React الأساسية -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { 
            font-family: 'Noto Naskh Arabic', serif; 
            background-color: #ffffff; 
            color: #1f2937; /* gray-800 */
        }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* تحسين مظهر الأزرار */
        button { font-family: 'Noto Naskh Arabic', serif; }
    </style>
</head>
<body class="selection:bg-blue-100">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- الأيقونات (SVG نقية 100%) ---
        const IconPlay = () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
        const IconCheckCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
        const IconXCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>;
        const IconArrowLeft = () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>;
        const IconTrophy = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>;
        const IconRefresh = () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>;
        const IconBook = () => <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>;
        const IconSparkles = () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>;
        const IconTarget = () => <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>;
        const IconYoutube = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M21.582,6.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.254,4,12,4,12,4S5.746,4,4.186,4.418 c-0.86,0.23-1.538,0.908-1.768,1.768C2,7.746,2,12,2,12s0,4.254,0.418,5.814c0.23,0.86,0.908,1.538,1.768,1.768 C5.746,20,12,20,12,20s6.254,0,7.814-0.418c0.86-0.23,1.538-0.908,1.768-1.768C22,16.254,22,12,22,12S22,7.746,21.582,6.186z M10,15.464V8.536L16,12L10,15.464z"/></svg>;

        // --- البيانات والأسئلة ---
        const QUIZ_QUESTIONS = [
            { text: "«ابتسمت الفرصة للشاب الطموح»\nما نوع الاستعارة هنا؟", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 0, explanation: "مكنية: شبه (الفرصة) بإنسان يبتسم، وحذف المشبه به (الإنسان) وأبقى صفة من صفاته (الابتسام)." },
            { text: "في مباراة كرة القدم، قال المعلق: «سجل الصقر هدف الفوز لفريقنا» (يقصد اللاعب السريع).\nما نوع الاستعارة؟", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 1, explanation: "تصريحية: شبه (اللاعب) بالصقر، وحذف المشبه وصرّح بلفظ المشبه به (الصقر)." },
            { text: "عندما ترى شخصًا يبذل جهدًا في إقناع شخص عنيد يرفض الفهم، فتقول له: «أنت تنفخ في رماد!»\nهذه الصورة تسمى:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 2, explanation: "تمثيلية: شبه (حالة من يبذل جهدًا بلا فائدة) بـ(حالة من ينفخ في الرماد ليشعله)، تشبيه موقف بموقف." },
            { text: "«غردت هواتفنا برسائل النجاح والتبريكات»\nنوع الاستعارة:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 0, explanation: "مكنية: شبه (الهواتف) بطيور تغرد، حذف المشبه به وأبقى صفة التغريد." },
            { text: "أثناء حفل التخرج قال المدير: «ودعنا أقمارًا تخرجوا من جامعتنا اليوم» (يقصد الطلاب).\nنوع الاستعارة:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 1, explanation: "تصريحية: شبه (الطلاب) بالأقمار، وحذف المشبه وصرّح بالمشبه به." },
            { text: "صديقك عاد لعادة سيئة كان قد تركها منذ زمن، فقلت له: «رجعت حليمة لعادتها القديمة»\nهذه الصورة:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 2, explanation: "تمثيلية: شبه موقف (من يعود لفعل تركه) بموقف المرأة (حليمة) في المثل الشعبي الشهير." },
            { text: "«طارت الأخبار السعيدة في أرجاء المدينة»\nنوع الاستعارة:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 0, explanation: "مكنية: شبه الأخبار السعيدة بطيور تطير، وحذف المشبه به (الطيور) وأبقى الطيران." },
            { text: "ذهبت إلى المستشفى، فتحدثت مع بحر في الطب (تقصد طبيبًا بارعًا جدًا).\nنوع الاستعارة:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 1, explanation: "تصريحية: شبه الطبيب العظيم بالبحر في علمه، فصرّح بالمشبه به (بحر)." },
            { text: "لمن يقدم خدمة لشخص لا يستحقها ولا يشكر عليها: «أنت تزرع في البحر»\nهذه الصورة:", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 2, explanation: "تمثيلية: شبه حالة من يصنع الخير في غير أهله بمن يزرع في ماء البحر فلا يحصد شيئًا." },
            { text: "«افترس المرض جسد الرجل الضعيف»\nما نوع الاستعارة؟", options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"], correct: 0, explanation: "مكنية: شبه المرض بحيوان مفترس، وحذف الحيوان وأبقى صفة الافتراس." }
        ];

        const CLASSIFY_PHRASES = [
            { id: 1, text: "بكى السحاب على الأرض العطشى", type: "makneya", explanation: "مكنية: شبه السحاب بإنسان يبكي، وحذف الإنسان." },
            { id: 2, text: "شاهدت أسدًا يقود الطائرة الحربية ببراعة", type: "tasreheya", explanation: "تصريحية: صرح بـ (أسد) وقصد الطيار الشجاع." },
            { id: 3, text: "لمن يشتري شيئًا مجهولًا: «أنت تشتري سمكًا في ماء»", type: "tamtheleya", explanation: "تمثيلية: شبه الموقف بموقف من يدفع المال في سمك لم يُصطَد بعد." },
            { id: 4, text: "عضتنا الأيام بنابها القاسي", type: "makneya", explanation: "مكنية: شبه الأيام بحيوان مفترس، وأبقى صفة العض والناب." },
            { id: 5, text: "قابلت كوكبًا في علوم الحاسوب", type: "tasreheya", explanation: "تصريحية: صرح بـ (كوكب) وقصد العالِم البارع." },
            { id: 6, text: "لمن يتردد في قراره: «أراك تقدم رجلًا وتؤخر أخرى»", type: "tamtheleya", explanation: "تمثيلية: تشبيه حالة المتردد بهذه الصورة التمثيلية." },
            { id: 7, text: "زأر الجندي في وجه الأعداء فهربوا", type: "makneya", explanation: "مكنية: شبه الجندي بأسد، وحذف المشبه به وأبقى صفة الزئير." },
            { id: 8, text: "«نسورنا تحمي سماء الوطن في كل وقت» (يقصد الطيارين)", type: "tasreheya", explanation: "تصريحية: شبه (الطيارين) بالنسور، وحذف المشبه وصرّح بلفظ المشبه به." },
            { id: 9, text: "بعد سنوات من الخصام، «عادت المياه إلى مجاريها»", type: "tamtheleya", explanation: "تمثيلية: شبه حالة عودة العلاقات الطيبة بحالة عودة المياه لمسارها الطبيعي." }
        ];

        const TF_QUESTIONS = [
            { text: "الاستعارة المكنية هي التي يُحذف فيها المشبه به، ونأتي بصفة من صفاته تدل عليه.", answer: true, explanation: "صواب: مثل (بكى السحاب)، حذفنا الإنسان وأتينا بالبكاء." },
            { text: "الاستعارة التصريحية هي التي نُصرح فيها بلفظ المشبه، ونحذف المشبه به.", answer: false, explanation: "خطأ: العكس هو الصحيح، نُصرح بلفظ (المشبه به) ونحذف المشبه." },
            { text: "عبارة «ألقى الخطيب دررًا» (ويقصد كلمات رائعة) تُعد استعارة مكنية.", answer: false, explanation: "خطأ: هي استعارة تصريحية، لأنه صرّح بالمشبه به (دررًا) وحذف المشبه (الكلمات)." },
            { text: "الاستعارة التمثيلية غالبًا ما نجدها في الأمثال الشعبية والمواقف الحياتية.", answer: true, explanation: "صواب: لأنها تشبيه صورة بصورة وموقف بموقف، مثل (تنفخ في رماد)." },
            { text: "في عبارة «طار قلبي من الفرح»، نوع الاستعارة هو استعارة مكنية.", answer: true, explanation: "صواب: شبه القلب بطائر يطير، وحذف الطائر وأبقى الطيران." }
        ];

        // --- المكون الرئيسي ---
        function App() {
            const [screen, setScreen] = useState('welcome');
            const [score, setScore] = useState(0);

            // Quiz State
            const [currentQ, setCurrentQ] = useState(0);
            const [isAnswered, setIsAnswered] = useState(false);
            const [selectedOpt, setSelectedOpt] = useState(null);

            // Classify State
            const [answers, setAnswers] = useState({});
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [classifyError, setClassifyError] = useState(false);

            // TF State
            const [tfCurrentQ, setTfCurrentQ] = useState(0);
            const [tfAnswered, setTfAnswered] = useState(false);
            const [tfSelected, setTfSelected] = useState(null);

            const resetGame = () => {
                setScreen('welcome');
                setScore(0);
                setCurrentQ(0);
                setIsAnswered(false);
                setSelectedOpt(null);
                setAnswers({});
                setIsSubmitted(false);
                setClassifyError(false);
                setTfCurrentQ(0);
                setTfAnswered(false);
                setTfSelected(null);
            };

            const HeaderCredits = () => (
                <div className="text-center mb-10 flex flex-col items-center gap-3 fade-in">
                    <h2 className="text-2xl font-bold text-gray-800 bg-gray-50 px-6 py-2 rounded-xl border border-gray-200 shadow-sm inline-block">
                        إعداد / محمود صلاح
                    </h2>
                    <a 
                        href="https://www.youtube.com/egysalah" 
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="text-3xl font-bold text-blue-700 hover:text-blue-800 transition-colors flex items-center gap-3 underline decoration-blue-200 hover:decoration-blue-400 underline-offset-8 mt-2"
                    >
                        <IconYoutube className="text-red-600 w-9 h-9" />
                        العربية السهلة
                    </a>
                </div>
            );

            const renderWelcome = () => (
                <div className="flex flex-col items-center justify-center min-h-[90vh] py-10 w-full max-w-4xl mx-auto fade-in">
                    <HeaderCredits />
                    
                    <div className="bg-blue-50 p-6 rounded-full inline-block mb-6 shadow-sm border border-blue-100">
                        <div className="text-blue-600"><IconBook /></div>
                    </div>
                    
                    <h1 className="text-4xl md:text-5xl lg:text-6xl font-extrabold text-gray-900 tracking-tight text-center leading-normal mb-6">
                        أسرار البلاغة: <span className="text-blue-700">الاستعارة</span>
                    </h1>
                    
                    <p className="text-xl md:text-2xl text-gray-600 max-w-2xl leading-loose text-center mb-10">
                        مرحباً بك يا بطل اللغة العربية! <br/>
                        في هذا التطبيق، سنتدرب على استخراج الاستعارة (المكنية، التصريحية، والتمثيلية) بأسلوب ممتع وأمثلة من حياتنا اليومية.
                    </p>
                    
                    <button
                        onClick={() => setScreen('quiz')}
                        className="bg-blue-600 hover:bg-blue-700 text-white text-2xl font-bold py-4 px-12 rounded-2xl shadow-lg transform transition-all hover:-translate-y-1 hover:shadow-xl flex items-center gap-4 border border-blue-700"
                    >
                        <IconPlay />
                        <span>ابدأ التدريب الأول</span>
                    </button>
                </div>
            );

            const renderQuiz = () => {
                const q = QUIZ_QUESTIONS[currentQ];
                const isCorrect = selectedOpt === q.correct;
                
                return (
                    <div className="fade-in max-w-3xl mx-auto py-12">
                        <div className="flex justify-between items-center mb-6 text-gray-500 font-bold px-2 text-xl">
                            <span>التدريب الأول: اكتشف النوع</span>
                            <span>السؤال {currentQ + 1} من {QUIZ_QUESTIONS.length}</span>
                        </div>
                        <div className="w-full bg-gray-200 h-3 rounded-full mb-10 overflow-hidden shadow-inner">
                            <div className="bg-blue-600 h-full transition-all duration-500 ease-out" style={{width: `${((currentQ + 1) / QUIZ_QUESTIONS.length) * 100}%`}}></div>
                        </div>

                        <div className="bg-white rounded-3xl p-8 md:p-10 shadow-lg border border-gray-100 mb-8">
                            <h2 className="text-2xl md:text-3xl font-bold text-gray-900 mb-10 leading-loose whitespace-pre-line text-center bg-gray-50 p-6 rounded-2xl border border-gray-100">
                                {q.text}
                            </h2>

                            <div className="space-y-5">
                                {q.options.map((opt, idx) => {
                                    let btnClass = "w-full text-right p-5 rounded-2xl border-2 transition-all duration-200 text-xl md:text-2xl font-bold flex justify-between items-center ";
                                    if (!isAnswered) {
                                        btnClass += "border-gray-200 hover:border-blue-600 hover:bg-blue-50 text-gray-700 bg-white shadow-sm cursor-pointer";
                                    } else {
                                        if (idx === q.correct) {
                                            btnClass += "border-green-500 bg-green-50 text-green-800 shadow-sm";
                                        } else if (idx === selectedOpt) {
                                            btnClass += "border-red-500 bg-red-50 text-red-800 shadow-sm";
                                        } else {
                                            btnClass += "border-gray-100 bg-gray-50 opacity-60 text-gray-400";
                                        }
                                    }

                                    return (
                                        <button
                                            key={idx}
                                            disabled={isAnswered}
                                            onClick={() => {
                                                setSelectedOpt(idx);
                                                setIsAnswered(true);
                                                if (idx === q.correct) setScore(s => s + 1);
                                            }}
                                            className={btnClass}
                                        >
                                            <span>{opt}</span>
                                            {isAnswered && idx === q.correct && <div className="text-green-600"><IconCheckCircle /></div>}
                                            {isAnswered && idx === selectedOpt && idx !== q.correct && <div className="text-red-600"><IconXCircle /></div>}
                                        </button>
                                    );
                                })}
                            </div>

                            {isAnswered && (
                                <div className={`mt-8 p-6 border rounded-2xl fade-in shadow-sm ${isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                                    <div className="flex items-center gap-3 mb-4 border-b pb-4" style={{borderColor: isCorrect ? 'rgba(21, 128, 61, 0.2)' : 'rgba(185, 28, 28, 0.2)'}}>
                                        <div className={isCorrect ? "text-green-600" : "text-red-600"}>
                                            {isCorrect ? <IconCheckCircle /> : <IconXCircle />}
                                        </div>
                                        <span className={`text-2xl font-bold ${isCorrect ? 'text-green-800' : 'text-red-800'}`}>
                                            {isCorrect ? 'إجابة صحيحة' : 'إجابة خاطئة'}
                                        </span>
                                    </div>
                                    <div className="flex items-start gap-4 mt-2">
                                        <div className={isCorrect ? "text-green-600 mt-1" : "text-red-600 mt-1"}><IconSparkles /></div>
                                        <span className={`text-xl md:text-2xl font-bold leading-loose ${isCorrect ? 'text-green-900' : 'text-red-900'}`}>{q.explanation}</span>
                                    </div>
                                </div>
                            )}
                        </div>

                        {isAnswered && (
                            <div className="flex justify-end fade-in px-2">
                                <button
                                    onClick={() => {
                                        if (currentQ < QUIZ_QUESTIONS.length - 1) {
                                            setCurrentQ(q => q + 1);
                                            setIsAnswered(false);
                                            setSelectedOpt(null);
                                        } else {
                                            setScreen('transition1');
                                        }
                                    }}
                                    className="bg-blue-600 hover:bg-blue-700 text-white text-xl md:text-2xl font-bold py-4 px-10 rounded-2xl shadow-lg transition-all flex items-center gap-3 hover:-translate-x-2"
                                >
                                    <span>{currentQ < QUIZ_QUESTIONS.length - 1 ? 'السؤال التالي' : 'إنهاء التدريب الأول'}</span>
                                    <IconArrowLeft />
                                </button>
                            </div>
                        )}
                    </div>
                );
            };

            const renderTransition1 = () => (
                <div className="text-center space-y-8 fade-in flex flex-col items-center justify-center min-h-[70vh]">
                    <div className="bg-green-50 p-8 rounded-full mb-4 shadow-sm border border-green-100">
                        <div className="text-green-600"><IconTarget /></div>
                    </div>
                    <h2 className="text-4xl md:text-5xl font-bold text-gray-900">عمل موفق!</h2>
                    <p className="text-2xl text-gray-600 leading-loose max-w-xl">
                        لقد أنهيت التدريب الأول.<br/>
                        الآن، دعنا ننتقل إلى التحدي الثاني: <br/>
                        <span className="font-bold text-blue-700 text-3xl inline-block mt-4">تصنيف العبارات البلاغية</span>
                    </p>
                    <button
                        onClick={() => setScreen('classify')}
                        className="bg-blue-600 hover:bg-blue-700 text-white text-2xl font-bold py-4 px-12 rounded-2xl shadow-lg mt-8 flex items-center gap-4 transition-all hover:-translate-y-1"
                    >
                        <span>ابدأ التحدي الثاني</span>
                        <IconArrowLeft />
                    </button>
                </div>
            );

            const renderClassify = () => {
                const typeLabels = { makneya: 'مكنية', tasreheya: 'تصريحية', tamtheleya: 'تمثيلية' };

                const handleClassifySelect = (phraseId, type) => {
                    if (isSubmitted) return;
                    setAnswers(prev => ({ ...prev, [phraseId]: type }));
                    setClassifyError(false);
                };

                const submitClassify = () => {
                    if (Object.keys(answers).length < CLASSIFY_PHRASES.length) {
                        setClassifyError(true);
                        return;
                    }
                    let correct = 0;
                    CLASSIFY_PHRASES.forEach(p => {
                        if (answers[p.id] === p.type) correct++;
                    });
                    setScore(prev => prev + correct);
                    setIsSubmitted(true);
                };

                return (
                    <div className="fade-in max-w-4xl mx-auto py-12">
                        <div className="mb-10 text-center bg-gray-50 p-8 rounded-3xl shadow-sm border border-gray-200">
                            <h2 className="text-3xl md:text-4xl font-bold text-blue-800 mb-4">التحدي الثاني: صنف الاستعارات</h2>
                            <p className="text-gray-700 text-xl md:text-2xl">اقرأ العبارة، ثم انقر على نوع الاستعارة المناسب لها.</p>
                        </div>

                        {classifyError && (
                            <div className="bg-red-50 text-red-800 p-5 rounded-2xl mb-8 text-center font-bold text-xl md:text-2xl fade-in shadow-sm border border-red-200">
                                ⚠️ الرجاء اختيار نوع لجميع العبارات قبل التحقق من الإجابات!
                            </div>
                        )}

                        <div className="space-y-6">
                            {CLASSIFY_PHRASES.map((phrase, index) => {
                                const selectedType = answers[phrase.id];
                                const isCorrect = selectedType === phrase.type;

                                return (
                                    <div key={phrase.id} className="bg-white p-6 md:p-8 rounded-3xl shadow-md border border-gray-200 transition-all">
                                        <div className="flex items-start gap-4 mb-6">
                                            <div className="bg-blue-50 text-blue-800 font-bold w-12 h-12 rounded-full flex items-center justify-center shrink-0 text-xl border border-blue-100">
                                                {index + 1}
                                            </div>
                                            <p className="text-2xl md:text-3xl font-bold text-gray-900 leading-loose">{phrase.text}</p>
                                        </div>
                                        
                                        <div className="grid grid-cols-3 gap-3 md:gap-6 pl-0 md:pl-16">
                                            {Object.keys(typeLabels).map(typeKey => {
                                                let btnClass = "py-4 px-2 text-center rounded-xl border-2 font-bold transition-all text-lg md:text-xl ";

                                                if (!isSubmitted) {
                                                    if (selectedType === typeKey) {
                                                        btnClass += "bg-blue-600 text-white border-blue-600 shadow-md transform scale-105";
                                                    } else {
                                                        btnClass += "bg-white text-gray-700 border-gray-300 hover:bg-blue-50 hover:border-blue-400 hover:text-blue-800";
                                                    }
                                                } else {
                                                    if (typeKey === phrase.type) {
                                                        btnClass += "bg-green-600 text-white border-green-600 shadow-md";
                                                    } else if (selectedType === typeKey && !isCorrect) {
                                                        btnClass += "bg-red-600 text-white border-red-600 shadow-md";
                                                    } else {
                                                        btnClass += "bg-gray-50 text-gray-400 border-gray-200 opacity-60";
                                                    }
                                                }

                                                return (
                                                    <button
                                                        key={typeKey}
                                                        disabled={isSubmitted}
                                                        onClick={() => handleClassifySelect(phrase.id, typeKey)}
                                                        className={btnClass}
                                                    >
                                                        {typeLabels[typeKey]}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                        {isSubmitted && (
                                            <div className={`mt-6 p-6 rounded-2xl text-xl font-bold flex flex-col gap-3 pl-0 md:pl-16 fade-in ${isCorrect ? 'bg-green-50 text-green-900 border border-green-200' : 'bg-red-50 text-red-900 border border-red-200'}`}>
                                                <div className="flex items-center gap-3 border-b pb-3" style={{borderColor: isCorrect ? 'rgba(21, 128, 61, 0.2)' : 'rgba(185, 28, 28, 0.2)'}}>
                                                    <div className={isCorrect ? "text-green-600" : "text-red-600"}>
                                                        {isCorrect ? <IconCheckCircle /> : <IconXCircle />}
                                                    </div>
                                                    <span className={`text-xl md:text-2xl ${isCorrect ? 'text-green-800' : 'text-red-800'}`}>
                                                        {isCorrect ? 'إجابة صحيحة' : 'إجابة خاطئة'}
                                                    </span>
                                                </div>
                                                <div className="flex items-start gap-4 mt-1">
                                                    <div className={isCorrect ? "text-green-600 mt-1" : "text-red-600 mt-1"}><IconSparkles /></div>
                                                    <span className="leading-loose">{phrase.explanation}</span>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        <div className="mt-12 flex justify-center pb-16">
                            {!isSubmitted ? (
                                <button
                                    onClick={submitClassify}
                                    className="bg-blue-600 hover:bg-blue-700 text-white text-2xl font-bold py-5 px-16 rounded-2xl shadow-lg transition-all hover:-translate-y-1 w-full md:w-auto border border-blue-700"
                                >
                                    التحقق من الإجابات
                                </button>
                            ) : (
                                <button
                                    onClick={() => setScreen('transition2')}
                                    className="bg-gray-800 hover:bg-gray-900 text-white text-2xl font-bold py-5 px-16 rounded-2xl shadow-lg transition-all hover:-translate-y-1 flex items-center justify-center gap-4 w-full md:w-auto"
                                >
                                    <span>المرحلة التالية</span>
                                    <IconArrowLeft />
                                </button>
                            )}
                        </div>
                    </div>
                );
            };

            const renderTransition2 = () => (
                <div className="text-center space-y-8 fade-in flex flex-col items-center justify-center min-h-[70vh]">
                    <div className="bg-blue-50 p-8 rounded-full mb-4 shadow-sm border border-blue-100">
                        <div className="text-blue-600"><IconBook /></div>
                    </div>
                    <h2 className="text-4xl md:text-5xl font-bold text-gray-900">أداء جيد!</h2>
                    <p className="text-2xl text-gray-600 leading-loose max-w-xl">
                        لقد أنهيت تحدي التصنيف.<br/>
                        تبقى لنا التحدي الأخير: <br/>
                        <span className="font-bold text-blue-700 text-3xl inline-block mt-4">أسئلة الصواب والخطأ</span>
                    </p>
                    <button
                        onClick={() => setScreen('trueFalse')}
                        className="bg-blue-600 hover:bg-blue-700 text-white text-2xl font-bold py-4 px-12 rounded-2xl shadow-lg mt-8 flex items-center gap-4 transition-all hover:-translate-y-1"
                    >
                        <span>ابدأ التحدي الأخير</span>
                        <IconArrowLeft />
                    </button>
                </div>
            );

            const renderTrueFalse = () => {
                const q = TF_QUESTIONS[tfCurrentQ];
                const isCorrect = tfSelected === q.answer;
                
                return (
                    <div className="fade-in max-w-3xl mx-auto py-12">
                        <div className="flex justify-between items-center mb-6 text-gray-500 font-bold px-2 text-xl">
                            <span>التدريب الثالث: صواب أم خطأ</span>
                            <span>السؤال {tfCurrentQ + 1} من {TF_QUESTIONS.length}</span>
                        </div>
                        <div className="w-full bg-gray-200 h-3 rounded-full mb-10 overflow-hidden shadow-inner">
                            <div className="bg-blue-600 h-full transition-all duration-500 ease-out" style={{width: `${((tfCurrentQ + 1) / TF_QUESTIONS.length) * 100}%`}}></div>
                        </div>

                        <div className="bg-white rounded-3xl p-8 md:p-10 shadow-lg border border-gray-100 mb-8">
                            <h2 className="text-2xl md:text-3xl font-bold text-gray-900 mb-10 leading-loose text-center bg-gray-50 p-8 rounded-2xl border border-gray-100">
                                {q.text}
                            </h2>

                            <div className="grid grid-cols-2 gap-6">
                                {/* زر صواب */}
                                <button
                                    disabled={tfAnswered}
                                    onClick={() => {
                                        setTfSelected(true);
                                        setTfAnswered(true);
                                        if (q.answer === true) setScore(s => s + 1);
                                    }}
                                    className={`py-6 rounded-2xl border-2 font-bold text-2xl transition-all ${
                                        !tfAnswered 
                                        ? "border-gray-200 hover:border-blue-500 hover:bg-blue-50 bg-white text-gray-800 shadow-sm"
                                        : (q.answer === true 
                                            ? "border-green-600 bg-green-50 text-green-800 shadow-md" 
                                            : (tfSelected === true ? "border-red-600 bg-red-50 text-red-800 shadow-md" : "border-gray-100 bg-gray-50 text-gray-400 opacity-60")
                                          )
                                    }`}
                                >
                                    صواب
                                </button>

                                {/* زر خطأ */}
                                <button
                                    disabled={tfAnswered}
                                    onClick={() => {
                                        setTfSelected(false);
                                        setTfAnswered(true);
                                        if (q.answer === false) setScore(s => s + 1);
                                    }}
                                    className={`py-6 rounded-2xl border-2 font-bold text-2xl transition-all ${
                                        !tfAnswered 
                                        ? "border-gray-200 hover:border-blue-500 hover:bg-blue-50 bg-white text-gray-800 shadow-sm"
                                        : (q.answer === false 
                                            ? "border-green-600 bg-green-50 text-green-800 shadow-md" 
                                            : (tfSelected === false ? "border-red-600 bg-red-50 text-red-800 shadow-md" : "border-gray-100 bg-gray-50 text-gray-400 opacity-60")
                                          )
                                    }`}
                                >
                                    خطأ
                                </button>
                            </div>

                            {tfAnswered && (
                                <div className={`mt-8 p-6 border rounded-2xl fade-in shadow-sm ${isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                                    <div className="flex items-center gap-3 mb-4 border-b pb-4" style={{borderColor: isCorrect ? 'rgba(21, 128, 61, 0.2)' : 'rgba(185, 28, 28, 0.2)'}}>
                                        <div className={isCorrect ? "text-green-600" : "text-red-600"}>
                                            {isCorrect ? <IconCheckCircle /> : <IconXCircle />}
                                        </div>
                                        <span className={`text-2xl font-bold ${isCorrect ? 'text-green-800' : 'text-red-800'}`}>
                                            {isCorrect ? 'إجابة صحيحة' : 'إجابة خاطئة'}
                                        </span>
                                    </div>
                                    <div className="flex items-start gap-4 mt-2">
                                        <div className={isCorrect ? "text-green-600 mt-1" : "text-red-600 mt-1"}><IconSparkles /></div>
                                        <span className={`text-xl md:text-2xl font-bold leading-loose ${isCorrect ? 'text-green-900' : 'text-red-900'}`}>{q.explanation}</span>
                                    </div>
                                </div>
                            )}
                        </div>

                        {tfAnswered && (
                            <div className="flex justify-end fade-in px-2">
                                <button
                                    onClick={() => {
                                        if (tfCurrentQ < TF_QUESTIONS.length - 1) {
                                            setTfCurrentQ(q => q + 1);
                                            setTfAnswered(false);
                                            setTfSelected(null);
                                        } else {
                                            setScreen('result');
                                        }
                                    }}
                                    className="bg-blue-600 hover:bg-blue-700 text-white text-xl md:text-2xl font-bold py-4 px-10 rounded-2xl shadow-lg transition-all flex items-center gap-3 hover:-translate-x-2"
                                >
                                    <span>{tfCurrentQ < TF_QUESTIONS.length - 1 ? 'السؤال التالي' : 'رؤية النتيجة النهائية'}</span>
                                    <IconArrowLeft />
                                </button>
                            </div>
                        )}
                    </div>
                );
            };

            const renderResult = () => {
                const totalScore = score;
                const maxScore = QUIZ_QUESTIONS.length + CLASSIFY_PHRASES.length + TF_QUESTIONS.length;
                const percentage = Math.round((totalScore / maxScore) * 100);

                let message = "";
                let colorClass = "";
                let iconColor = "";

                if (percentage < 50) {
                    message = "لا بأس، التدريب المستمر يصنع المستحيل! حاول مرة أخرى.";
                    colorClass = "text-red-600";
                    iconColor = "text-red-500";
                } else if (percentage < 85) {
                    message = "جيد جدًا! أنت تفهم البلاغة بشكل جميل.";
                    colorClass = "text-blue-600";
                    iconColor = "text-blue-500";
                } else {
                    message = "ممتاز ومذهل! أنت خبير حقيقي في البلاغة والاستعارة!";
                    colorClass = "text-green-600";
                    iconColor = "text-green-500";
                }

                return (
                    <div className="text-center space-y-10 fade-in flex flex-col items-center justify-center min-h-[85vh]">
                        <div className="relative mb-6">
                            <IconTrophy className={`w-40 h-40 ${iconColor} drop-shadow-xl`} />
                            <div className="absolute -top-2 -right-6 bg-yellow-500 text-white w-16 h-16 rounded-full flex items-center justify-center font-bold text-2xl shadow-xl transform rotate-12 border-4 border-white">
                                {percentage}%
                            </div>
                        </div>
                        
                        <div className="bg-white p-10 rounded-3xl shadow-xl border border-gray-100 max-w-lg w-full relative overflow-hidden">
                            <div className={`absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-blue-500 to-green-500`}></div>
                            <h2 className="text-3xl font-bold text-gray-500 mb-4">مجموع نقاطك</h2>
                            <div className="text-8xl font-black text-gray-900 mb-6 tracking-tighter" style={{ direction: 'ltr' }}>
                                {totalScore} <span className="text-4xl text-gray-300 font-medium mx-2">/</span> {maxScore}
                            </div>
                            <p className={`text-2xl font-bold mt-8 px-4 leading-loose ${colorClass}`}>{message}</p>
                        </div>

                        <button
                            onClick={resetGame}
                            className="bg-blue-600 hover:bg-blue-700 text-white text-2xl font-bold py-5 px-14 rounded-2xl shadow-lg flex items-center gap-4 transition-all hover:-translate-y-1 mt-6 border border-blue-700"
                        >
                            <IconRefresh />
                            <span>تدرب مرة أخرى</span>
                        </button>
                    </div>
                );
            };

            return (
                <div className="container mx-auto px-4 md:px-8 max-w-5xl">
                    {screen === 'welcome' && renderWelcome()}
                    {screen === 'quiz' && renderQuiz()}
                    {screen === 'transition1' && renderTransition1()}
                    {screen === 'classify' && renderClassify()}
                    {screen === 'transition2' && renderTransition2()}
                    {screen === 'trueFalse' && renderTrueFalse()}
                    {screen === 'result' && renderResult()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
