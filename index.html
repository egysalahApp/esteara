<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تدريبات الاستعارة | العربية السهلة</title>
    <!-- تضمين مكتبات React و ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- تضمين Babel لتحويل كود JSX داخل المتصفح -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- تضمين Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
        body { 
            font-family: 'Tajawal', system-ui, -apple-system, sans-serif; 
            background-color: #f8fafc; 
        }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="selection:bg-indigo-200 text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- مكونات الأيقونات (تم تحويلها لتعمل مباشرة بدون مكتبات خارجية) ---
        const IconPlay = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
        const IconCheckCircle = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
        const IconXCircle = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>;
        const IconArrowLeft = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>;
        const IconTrophy = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>;
        const IconRefreshCw = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>;
        const IconBookOpen = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>;
        const IconTarget = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>;
        const IconSparkles = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path><path d="M5 3v4"></path><path d="M19 17v4"></path><path d="M3 5h4"></path><path d="M17 19h4"></path></svg>;

        // --- البيانات والأسئلة ---
        const QUIZ_QUESTIONS = [
            {
                id: 1,
                text: "«ابتسمت الفرصة للشاب الطموح»\nما نوع الاستعارة هنا؟",
                options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"],
                correct: 0,
                explanation: "استعارة مكنية: شبه (الفرصة) بإنسان يبتسم، وحذف المشبه به (الإنسان) وأبقى صفة من صفاته (الابتسام)."
            },
            {
                id: 2,
                text: "في مباراة كرة القدم، قال المعلق: «سجل الصقر هدف الفوز لفريقنا» (يقصد اللاعب السريع).\nما نوع الاستعارة؟",
                options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"],
                correct: 1,
                explanation: "استعارة تصريحية: شبه (اللاعب) بالصقر، وحذف المشبه (اللاعب) وصرّح بلفظ المشبه به (الصقر)."
            },
            {
                id: 3,
                text: "عندما ترى شخصاً يبذل جهداً في إقناع شخص عنيد يرفض الفهم، فتقول له: «أنت تنفخ في رماد!»\nهذه الصورة تسمى:",
                options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"],
                correct: 2,
                explanation: "استعارة تمثيلية: شبه (حالة من يبذل جهداً بلا فائدة) بـ(حالة من ينفخ في الرماد ليشعله)، فهي تشبيه موقف كامل بموقف."
            },
            {
                id: 4,
                text: "«غردت هواتفنا برسائل النجاح والتبريكات»\nنوع الاستعارة:",
                options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"],
                correct: 0,
                explanation: "استعارة مكنية: شبه (الهواتف) بطيور تغرد، حذف المشبه به وأبقى صفة التغريد."
            },
            {
                id: 5,
                text: "أثناء حفل التخرج قال المدير: «ودعنا أقماراً تخرجوا من جامعتنا اليوم» (يقصد الطلاب الخريجين).\nنوع الاستعارة:",
                options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"],
                correct: 1,
                explanation: "استعارة تصريحية: شبه (الطلاب) بالأقمار، وحذف المشبه وصرّح بالمشبه به."
            },
            {
                id: 6,
                text: "صديقك عاد لعادة سيئة كان قد تركها منذ زمن، فقلت له: «رجعت حليمة لعادتها القديمة»\nهذه الصورة:",
                options: ["استعارة مكنية", "استعارة تصريحية", "استعارة تمثيلية"],
                correct: 2,
                explanation: "استعارة تمثيلية: شبه موقف (من يعود لفعل تركه) بموقف المرأة (حليمة) في المثل الشهير."
            }
        ];

        const CLASSIFY_PHRASES = [
            { id: 1, text: "بكى السحاب على الأرض العطشى", type: "makneya", explanation: "مكنية: شبه السحاب بإنسان يبكي، وحذف الإنسان." },
            { id: 2, text: "شاهدت أسداً يقود الطائرة الحربية ببراعة", type: "tasreheya", explanation: "تصريحية: صرح بـ (أسد) وقصد الطيار الشجاع." },
            { id: 3, text: "لمن يشتري شيئاً مجهولاً: «أنت تشتري سمكاً في ماء»", type: "tamtheleya", explanation: "تمثيلية: شبه الموقف بموقف من يدفع المال في سمك لم يُصطَد بعد." },
            { id: 4, text: "عضتنا الأيام بنابها القاسي", type: "makneya", explanation: "مكنية: شبه الأيام بحيوان مفترس، وأبقى صفة العض والناب." },
            { id: 5, text: "تحدثت مع كوكب في علوم الحاسوب", type: "tasreheya", explanation: "تصريحية: صرح بـ (كوكب) وقصد العالِم البارع." },
            { id: 6, text: "لمن يتردد في قراره: «أراك تقدم رجلاً وتؤخر أخرى»", type: "tamtheleya", explanation: "تمثيلية: تشبيه حالة المتردد بهذه الصورة التمثيلية." }
        ];

        // --- المكون الرئيسي ---
        function App() {
            const [screen, setScreen] = useState('welcome');
            const [score, setScore] = useState(0);

            // Quiz State
            const [currentQ, setCurrentQ] = useState(0);
            const [isAnswered, setIsAnswered] = useState(false);
            const [selectedOpt, setSelectedOpt] = useState(null);

            // Classify State
            const [answers, setAnswers] = useState({});
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [classifyError, setClassifyError] = useState(false);

            const resetGame = () => {
                setScreen('welcome');
                setScore(0);
                setCurrentQ(0);
                setIsAnswered(false);
                setSelectedOpt(null);
                setAnswers({});
                setIsSubmitted(false);
                setClassifyError(false);
            };

            const renderWelcome = () => (
                <div className="text-center space-y-6 fade-in flex flex-col items-center justify-center min-h-[85vh] py-10">
                    
                    {/* إضافة الاسم هنا كما طلبت */}
                    <div className="inline-block bg-indigo-50 px-6 py-2.5 rounded-full shadow-sm text-indigo-700 font-bold mb-4 border border-indigo-200">
                        إعداد/ محمود صلاح ـ العربية السهلة
                    </div>

                    <div className="bg-indigo-100 p-6 rounded-full inline-block mb-2 shadow-inner">
                        <IconBookOpen className="w-16 h-16 text-indigo-600" />
                    </div>
                    
                    <h1 className="text-4xl md:text-5xl font-extrabold text-slate-800 tracking-tight">
                        أسرار البلاغة: <span className="text-indigo-600">الاستعارة</span>
                    </h1>
                    
                    <p className="text-lg md:text-xl text-slate-600 max-w-xl leading-relaxed mt-4">
                        مرحباً بك يا بطل اللغة العربية! 🌟 <br/>
                        في هذا التطبيق، سنتدرب على استخراج الاستعارة (المكنية، التصريحية، والتمثيلية) بأسلوب ممتع وأمثلة من حياتنا اليومية.
                    </p>
                    
                    <button
                        onClick={() => setScreen('quiz')}
                        className="bg-indigo-600 hover:bg-indigo-700 text-white text-xl font-bold py-4 px-10 rounded-2xl shadow-lg transform transition-all hover:-translate-y-1 hover:shadow-xl flex items-center gap-3 mt-8"
                    >
                        <IconPlay className="w-6 h-6" />
                        <span>ابدأ التدريب الأول</span>
                    </button>
                </div>
            );

            const renderQuiz = () => {
                const q = QUIZ_QUESTIONS[currentQ];
                return (
                    <div className="fade-in max-w-2xl mx-auto py-8">
                        <div className="flex justify-between items-center mb-4 text-slate-500 font-medium px-2">
                            <span>التدريب الأول: اكتشف النوع</span>
                            <span>السؤال {currentQ + 1} من {QUIZ_QUESTIONS.length}</span>
                        </div>
                        <div className="w-full bg-slate-200 h-2.5 rounded-full mb-8 overflow-hidden shadow-inner">
                            <div className="bg-indigo-600 h-full transition-all duration-500 ease-out" style={{width: `${((currentQ + 1) / QUIZ_QUESTIONS.length) * 100}%`}}></div>
                        </div>

                        <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200 mb-6">
                            <h2 className="text-2xl font-bold text-slate-800 mb-8 leading-loose whitespace-pre-line text-center bg-slate-50 p-4 rounded-xl">
                                {q.text}
                            </h2>

                            <div className="space-y-4">
                                {q.options.map((opt, idx) => {
                                    let btnClass = "w-full text-right p-4 rounded-xl border-2 transition-all duration-200 text-lg font-bold flex justify-between items-center ";
                                    if (!isAnswered) {
                                        btnClass += "border-slate-200 hover:border-indigo-600 hover:bg-indigo-50 text-slate-700 bg-white shadow-sm hover:shadow-md";
                                    } else {
                                        if (idx === q.correct) {
                                            btnClass += "border-emerald-500 bg-emerald-50 text-emerald-800 shadow-sm";
                                        } else if (idx === selectedOpt) {
                                            btnClass += "border-rose-500 bg-rose-50 text-rose-800 shadow-sm";
                                        } else {
                                            btnClass += "border-slate-100 bg-slate-50 opacity-50 text-slate-400";
                                        }
                                    }

                                    return (
                                        <button
                                            key={idx}
                                            disabled={isAnswered}
                                            onClick={() => {
                                                setSelectedOpt(idx);
                                                setIsAnswered(true);
                                                if (idx === q.correct) setScore(s => s + 1);
                                            }}
                                            className={btnClass}
                                        >
                                            <span>{opt}</span>
                                            {isAnswered && idx === q.correct && <IconCheckCircle className="w-6 h-6 text-emerald-500 shrink-0" />}
                                            {isAnswered && idx === selectedOpt && idx !== q.correct && <IconXCircle className="w-6 h-6 text-rose-500 shrink-0" />}
                                        </button>
                                    );
                                })}
                            </div>

                            {isAnswered && (
                                <div className="mt-8 p-5 bg-indigo-50 border border-indigo-100 rounded-2xl fade-in">
                                    <div className="flex items-start gap-3">
                                        <IconSparkles className="w-6 h-6 text-indigo-500 flex-shrink-0 mt-0.5" />
                                        <span className="text-lg text-indigo-900 font-medium leading-relaxed">{q.explanation}</span>
                                    </div>
                                </div>
                            )}
                        </div>

                        {isAnswered && (
                            <div className="flex justify-end fade-in px-2">
                                <button
                                    onClick={() => {
                                        if (currentQ < QUIZ_QUESTIONS.length - 1) {
                                            setCurrentQ(q => q + 1);
                                            setIsAnswered(false);
                                            setSelectedOpt(null);
                                        } else {
                                            setScreen('transition');
                                        }
                                    }}
                                    className="bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-bold py-3 px-8 rounded-xl shadow-md transition-all flex items-center gap-3 hover:-translate-x-1"
                                >
                                    <span>{currentQ < QUIZ_QUESTIONS.length - 1 ? 'السؤال التالي' : 'إنهاء التدريب الأول'}</span>
                                    <IconArrowLeft className="w-5 h-5" />
                                </button>
                            </div>
                        )}
                    </div>
                );
            };

            const renderTransition = () => (
                <div className="text-center space-y-6 fade-in flex flex-col items-center justify-center min-h-[60vh]">
                    <div className="bg-emerald-100 p-6 rounded-full mb-2 shadow-inner">
                        <IconTarget className="w-14 h-14 text-emerald-600" />
                    </div>
                    <h2 className="text-3xl md:text-4xl font-bold text-slate-800">عمل رائع! 👏</h2>
                    <p className="text-xl text-slate-600 leading-relaxed max-w-md">
                        لقد أنهيت التدريب الأول بنجاح.<br/>
                        الآن، دعنا ننتقل إلى التحدي الثاني: <br/>
                        <span className="font-bold text-indigo-600 text-2xl inline-block mt-2">تصنيف العبارات البلاغية</span>
                    </p>
                    <button
                        onClick={() => setScreen('classify')}
                        className="bg-indigo-600 hover:bg-indigo-700 text-white text-xl font-bold py-4 px-10 rounded-2xl shadow-lg mt-8 flex items-center gap-3 transition-all hover:-translate-y-1 hover:shadow-xl"
                    >
                        <span>ابدأ التحدي الثاني</span>
                        <IconArrowLeft className="w-6 h-6" />
                    </button>
                </div>
            );

            const renderClassify = () => {
                const typeLabels = { makneya: 'مكنية', tasreheya: 'تصريحية', tamtheleya: 'تمثيلية' };

                const handleClassifySelect = (phraseId, type) => {
                    if (isSubmitted) return;
                    setAnswers(prev => ({ ...prev, [phraseId]: type }));
                    setClassifyError(false);
                };

                const submitClassify = () => {
                    if (Object.keys(answers).length < CLASSIFY_PHRASES.length) {
                        setClassifyError(true);
                        return;
                    }
                    let correct = 0;
                    CLASSIFY_PHRASES.forEach(p => {
                        if (answers[p.id] === p.type) correct++;
                    });
                    setScore(prev => prev + correct);
                    setIsSubmitted(true);
                };

                return (
                    <div className="fade-in max-w-3xl mx-auto py-8">
                        <div className="mb-8 text-center bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                            <h2 className="text-2xl md:text-3xl font-bold text-indigo-700 mb-3">التحدي الثاني: صنف الاستعارات</h2>
                            <p className="text-slate-600 text-lg">اقرأ العبارة ثم انقر على نوع الاستعارة المناسب لها.</p>
                        </div>

                        {classifyError && (
                            <div className="bg-rose-100 text-rose-800 p-4 rounded-xl mb-6 text-center font-bold text-lg fade-in shadow-sm border border-rose-200">
                                ⚠️ الرجاء اختيار نوع لجميع العبارات قبل التحقق من الإجابات!
                            </div>
                        )}

                        <div className="space-y-4">
                            {CLASSIFY_PHRASES.map((phrase, index) => {
                                const selectedType = answers[phrase.id];
                                const isCorrect = selectedType === phrase.type;

                                return (
                                    <div key={phrase.id} className="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200 transition-all hover:shadow-md">
                                        <div className="flex items-start gap-4 mb-5">
                                            <div className="bg-slate-100 text-slate-500 font-bold w-8 h-8 rounded-full flex items-center justify-center shrink-0">
                                                {index + 1}
                                            </div>
                                            <p className="text-xl font-bold text-slate-800 leading-snug">{phrase.text}</p>
                                        </div>
                                        
                                        <div className="grid grid-cols-3 gap-3 md:gap-4 pl-0 md:pl-12">
                                            {Object.keys(typeLabels).map(typeKey => {
                                                let btnClass = "py-3 px-2 text-center rounded-xl border-2 font-bold transition-all text-sm md:text-base ";

                                                if (!isSubmitted) {
                                                    if (selectedType === typeKey) {
                                                        btnClass += "bg-indigo-600 text-white border-indigo-600 shadow-md transform scale-105";
                                                    } else {
                                                        btnClass += "bg-slate-50 text-slate-600 border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-700";
                                                    }
                                                } else {
                                                    if (typeKey === phrase.type) {
                                                        btnClass += "bg-emerald-500 text-white border-emerald-500 shadow-sm";
                                                    } else if (selectedType === typeKey && !isCorrect) {
                                                        btnClass += "bg-rose-500 text-white border-rose-500 shadow-sm";
                                                    } else {
                                                        btnClass += "bg-slate-50 text-slate-400 border-slate-100 opacity-50";
                                                    }
                                                }

                                                return (
                                                    <button
                                                        key={typeKey}
                                                        disabled={isSubmitted}
                                                        onClick={() => handleClassifySelect(phrase.id, typeKey)}
                                                        className={btnClass}
                                                    >
                                                        {typeLabels[typeKey]}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                        {isSubmitted && (
                                            <div className={`mt-5 p-4 rounded-xl text-base font-medium flex items-start gap-3 pl-0 md:pl-12 fade-in ${isCorrect ? 'bg-emerald-50 text-emerald-900 border border-emerald-100' : 'bg-rose-50 text-rose-900 border border-rose-100'}`}>
                                                {isCorrect ? <IconCheckCircle className="w-6 h-6 text-emerald-500 flex-shrink-0" /> : <IconXCircle className="w-6 h-6 text-rose-500 flex-shrink-0" />}
                                                <span>{phrase.explanation}</span>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        <div className="mt-10 flex justify-center pb-12">
                            {!isSubmitted ? (
                                <button
                                    onClick={submitClassify}
                                    className="bg-indigo-600 hover:bg-indigo-700 text-white text-xl font-bold py-4 px-12 rounded-2xl shadow-lg transition-all hover:-translate-y-1 w-full md:w-auto"
                                >
                                    التحقق من الإجابات
                                </button>
                            ) : (
                                <button
                                    onClick={() => setScreen('result')}
                                    className="bg-slate-800 hover:bg-slate-900 text-white text-xl font-bold py-4 px-12 rounded-2xl shadow-lg transition-all hover:-translate-y-1 flex items-center justify-center gap-3 w-full md:w-auto"
                                >
                                    <span>رؤية النتيجة النهائية</span>
                                    <IconArrowLeft className="w-6 h-6" />
                                </button>
                            )}
                        </div>
                    </div>
                );
            };

            const renderResult = () => {
                const totalScore = score;
                const maxScore = QUIZ_QUESTIONS.length + CLASSIFY_PHRASES.length;
                const percentage = Math.round((totalScore / maxScore) * 100);

                let message = "";
                let color = "";
                if (percentage < 50) {
                    message = "لا بأس، التدريب المستمر يصنع المستحيل! حاول مرة أخرى. 📚";
                    color = "text-rose-500";
                } else if (percentage < 85) {
                    message = "عمل جيد جداً! أنت تفهم البلاغة بشكل رائع. 🌟";
                    color = "text-indigo-500";
                } else {
                    message = "ممتاز ومذهل! أنت خبير حقيقي في البلاغة والاستعارة! 🏆";
                    color = "text-emerald-500";
                }

                return (
                    <div className="text-center space-y-8 fade-in flex flex-col items-center justify-center min-h-[75vh]">
                        <div className="relative mb-4">
                            <IconTrophy className={`w-36 h-36 ${color} drop-shadow-xl`} />
                            <div className="absolute -top-4 -right-6 bg-amber-400 text-white w-14 h-14 rounded-full flex items-center justify-center font-bold text-xl shadow-lg transform rotate-12 border-4 border-white">
                                {percentage}%
                            </div>
                        </div>
                        
                        <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 max-w-md w-full relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-2 bg-indigo-500"></div>
                            <h2 className="text-2xl font-bold text-slate-500 mb-2">مجموع نقاطك</h2>
                            <div className="text-7xl font-black text-slate-800 mb-4 tracking-tighter" style={{ direction: 'ltr' }}>
                                {totalScore} <span className="text-3xl text-slate-300 font-medium mx-1">/</span> {maxScore}
                            </div>
                            <p className={`text-xl font-bold mt-6 px-4 leading-relaxed ${color}`}>{message}</p>
                        </div>

                        <button
                            onClick={resetGame}
                            className="bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-bold py-4 px-10 rounded-2xl shadow-lg flex items-center gap-3 transition-all hover:-translate-y-1 mt-4"
                        >
                            <IconRefreshCw className="w-6 h-6" />
                            <span>تدرب مرة أخرى</span>
                        </button>
                    </div>
                );
            };

            return (
                <div className="container mx-auto px-4 md:px-8">
                    {screen === 'welcome' && renderWelcome()}
                    {screen === 'quiz' && renderQuiz()}
                    {screen === 'transition' && renderTransition()}
                    {screen === 'classify' && renderClassify()}
                    {screen === 'result' && renderResult()}
                </div>
            );
        }

        // --- تهيئة التطبيق ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
